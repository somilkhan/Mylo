ze:11px;color:var(--muted);text-align:center;margin:14px 0 2px}.mini{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(480px,calc(100% - 28px));z-index:8;background:#fffffff2;backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:17px;padding:9px 13px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 38px #252b4524}.mini .art{width:38px;height:38px;border-radius:9px}.mini button{border:0;background:none;padding:7px;font-size:17px}.sheetback{position:fixed;inset:0;background:#22263b66;z-index:20;display:flex;align-items:end;justify-content:center;backdrop-filter:blur(5px)}.sheet{width:min(560px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:25px 25px 0 0;padding:24px;box-shadow:var(--shadow);animation:up .22s ease}.sheet:before{content:"";display:block;width:38px;height:4px;border-radius:9px;background:#d9dbea;margin:-10px auto 20px}.sheet h2{margin:0 0 6px;font-size:22px}.sheet p{color:var(--muted);font-size:13px}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#24263a;color:#fff;border-radius:12px;padding:10px 16px;font-size:12px;z-index:30}.progress{height:6px;background:#e9e6ff;border-radius:10px;overflow:hidden;margin:15px 0}.progress span{display:block;height:100%;background:var(--violet);width:0}.empty{text-align:center;padding:28px;color:var(--muted)}@keyframes up{from{transform:translateY(30px);opacity:.7}to{transform:none;opacity:1}}@media(max-width:760px){.app{padding:0 16px 90px}.top{height:68px}.page{padding-top:22px}.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.welcome{align-items:start;flex-direction:column}.datechip{display:none}.sidecol{grid-template-columns:1fr 1fr}.sidecol .card:first-child{grid-column:1/-1}}@media(max-width:440px){.sidecol{grid-template-columns:1fr}.sidecol .card:first-child{grid-column:auto}.h1{font-size:30px}.card{padding:16px}.metric{padding:13px}.metric strong{font-size:23px}.gen-controls{gri function actions(kind,id){let t=kind==="track"?tracks.find(x=>x.id===id):null;showSheet(kind==="track"?"Track actions":kind+" actions",'<div class="actions"><button class="primary" onclick="play('+id+')">Play now</button><button class="secondary" onclick="queue('+id+')">Add to queue</button></div><div class="row" onclick="toast(\'Added to favourites\');closeSheet()"><div class="meta"><b>♡  '+(t&&state.favs.has(id)?"Remove favourite":"Add to favourites")+'</b><small>Keep it close</small></div></div><div class="row" onclick="push(\'track\',{item:tracks.find(x=>x.id==='+id+')});closeSheet()"><div class="meta"><b>Track details</b></div></div>')}

function stats(){let total=state.period==="7 days"?128:state.period==="90 days"?1328:state.period==="1 year"?4892:state.period==="All time"?12480:412;return '<div class="eyebrow">YOUR LISTENING, IN FOCUS</div><h1 class="h1">Statistics</h1><p class="sub">A little more of what you love.</p><div class="pills" style="margin:20px 0 14px">'+["7 days","30 days","90 days","1 year","All time","Custom"].map(p=>'<button class="pill '+(state.period===p?'active':'')+'" onclick="period(\''+p+'\')">'+p+'</button>').join('')+'</div><div class="stats">'+[['Plays',total.toLocaleString(),'↗ 12%','tracks'],['Listening time','86h 24m','↗ 8%','time'],['Unique tracks','312','+24 this period','tracks'],['Artists','94','+8 this period','artists'],['Albums','126','+11 this period','albums'],['Streak','12 days','Personal best · 18','history']].map((m,i)=>'<button class="metric" onclick="metric('+i+')"><span>'+m[0]+'</span><strong>'+m[1]+'</strong><span>'+m[2]+'</span></button>').join('')+'</div><div class="section"><h2>Listening activity</h2><button class="link" onclick="push(\'history\')">History ↗</button></div><div class="panel"><div style="display:flex;justify-content:space-between"><b>Daily plays</b><small class="muted">Last 14 days</small></div><div class="chart">'+[32,46,28,65,50,74,42,88,58,68,37,95,61,78].map((v,i)=>'<div class="bar '+(i===12?'sel':'')+'" style="height:'+v+'%" onclick="toast(\''+(i+1)+' days ago · '+v+' plays\')"></div>').join('')+'</div><div class="chartlabels"><span>14 days ago</span><span>Today</span></div></div><div class="section"><h2>Most played</h2><button class="link" onclick="push(\'toptracks\')">See all ↗</button></div>'+tracks.slice(0,4).map((t,i)=>row(t,i)).join('')+'<div class="section"><h2>Top artists</h2><button class="link" onclick="push(\'topartists\')">See all ↗</button></div>'+artists.slice(0,3).map((t,i)=>row(t,i,"artist")).join('')+'<div class="section"><h2>Top albums</h2><button class="link" onclick="push(\'topalbums\')">See all ↗</button></div> function listPage(kind){let data=kind==="toptracks"?tracks:kind==="topartists"?artists:albums;let q=state.search.toLowerCase();data=data.filter(x=>(x.t||x.name).toLowerCase().includes(q)||(x.a||x.artist||"").toLowerCase().includes(q));if(state.sort==="A–Z")data=[...data].sort((a,b)=>(a.t||a.name).localeCompare(b.t||b.name));else data=[...data].sort((a,b)=>(b.plays||0)-(a.plays||0));let title=kind==="toptracks"?"Top tracks":kind==="topartists"?"Top artists":"Top albums";return '<div class="eyebrow">STATISTICS</div><h1 class="h1">'+title+'</h1><input class="search" placeholder="Search '+title.toLowerCase()+'" value="'+state.search+'" oninput="state.search=this.value;render()"><div class="pills"><button class="pill active" onclick="state.sort=\'Plays\';render()">Most played</button><button class="pill" onclick="state.sort=\'A–Z\';render()">A–Z</button><button class="pill" onclick="toast(\'Period: \'+state.period)">Period · '+state.period+'</button></div>'+data.map((x,i)=>row(x,i,kind==="toptracks"?"track":kind==="topartists"?"artist":"album")).join('')}

rt)+'<div class="meta"><b>'+t.t+'</b><small>'+t.a+'</small></div><small class="right">'+t.date+'</small><button class="iconbtn" onclick="event.stopPropagation();actions(\'track\','+t.id+')">···</button></div>').join('')}
function detail(kind){let t=state.item||tracks[0],isTrack=kind==="track";let name=isTrack?t.t:t.name,sub=isTrack?t.a:(kind==="artist"?"Artist":t.artist);let art=t.art||tracks[0].art;let related=isTrack?tracks.filter(x=>x.a===t.a):tracks.filter(x=>kind==="artist"?x.a===name:x.al===name);return '<div class="eyebrow">LIBRARY / '+kind.toUpperCase()+'</div><div class="hero">'+img(art,'art big')+'<div><h1>'+name+'</h1><div class="sub">'+sub+'</div><div class="sub" style="margin-top:7px">'+(t.plays||60)+' plays · '+(t.dur||"3:54")+'</div></div></div><div class="actions"><button class="primary" onclick="play('+(t.id||1)+')">▶ Play</button><button class="secondary" onclick="toast(\'Shuffling '+name+'\')">Shuffle</button><button class="secondary" onclick="toast(\'Added to queue\')">＋ Queue</button></div><div class="stats"><div class="metric"><span>Total plays</span><strong>'+(t.plays||60)+'</strong></div><div class="metric"><span>Listening time</span><strong>4h 32m</strong></div></div><div class="section"><h2>'+(isTrack?"Listening history":"Top tracks")+'</h2></div>'+related.map((x,i)=>row(x,i)).join('')+'<div class="panel" style="margin-top:20px"><span class="muted">First played</span><b style="float:right">Jan 12, 2025</b><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><span class="muted">Last played</span><b style="float:right">Today</b></div>'}
function generate(){let g=state.gen;return '<div class="eyebrow">MADE FROM YOUR LISTENS</div><h1 class="h1">Generate</h1><p class="sub">A playlist that sounds like you.</p><div class="step">'+[0,1,2,3].map(i=>'<i class="'+(state.step>=i?'on':'')+'"></i>').join('')+'</div>'+ (state.step===0?'<h2>Choose a source</h2><p class="sub">Start with the part of your library you want to explore.</p>'+["Listening history","Most played tracks","Favourite tracks","Favourite artists","Favourite albums","Existing playlists","Manually selected tracks"].map((x,i)=>'<button class="tile" style="width:100%;min-height:0;margin:5px 0" onclick="state.gen.source=\''+x+'\';state.step=1;render()"><b>'+(i+1)+'. '+x+'</b><small>'+(i===0?"Build from everything you have listened to":i===1?"Your most replayed tracks":"Use your saved "+x.toLowerCase())+'</small></button>').join(''):'')+(state.step===1?'<h2>Choose a recipe</h2><p class="sub">A starting point. You can tune the result next.</p>'+["Personal favourites","Forgotten favourites","Daily mix","Artist-focused mix","Discovery mix","Similar tracks","Time-period mix","Listening-history mix"].map((x,i)=>'<button class="tile" style="width:100%;min-height:0;margin:5px 0" onclick="state.gen.recipe=\''+x+'\';state.step=2;render()"><b>'+x+'</b><small>'+["Your most-loved tracks, balanced across artists.","Loved before, missing from recent rotation.","A fresh set for today.","Go deeper with artists you return to.","A little unfamiliar, still your taste.","Find adjacent sounds from familiar tracks.","A snapshot from a chosen era.","A mix shaped by a listening period."][i]+'</small></button>').join(''):'')+(state.step===2?'<h2>Shape your mix</h2><div class="field"><label>Playlist name</label><input id="gname" value="'+g.name+'"></div><div class="field"><label>Tracks · '+g.count+'</label><input type="range" min="10" max="60" step="5" value="'+g.count+'" oninput="state.gen.count=+this.value;this.previousElementSibling.textContent=&quot;Tracks · &quot;+this.value"></div><div class="field"><label>Date range</label><select onchange="state.gen.range=this.value"><option>Last 90 days</option><option>Last 30 days</option><option>All time</option><option>Last year</option></select></div><div class="field"><label>Familiarity · '+g.diversity+'%</label><input type="range" min="0" max="100" value="'+g.diversity+'" oninput="state.gen.diversity=+this.value;this.previousElementSibling.textContent=&quot;Familiarity · &quot;+this.value+&quot;%&quot;"></div><div class="field"><label>Discovery · '+g.discovery+'%</label><input type="range" min="0" max="100" value="'+g.discovery+'" oninput="state.gen.discovery=+this.value;this.previousElementSibling.textContent=&quot;Discovery · &quot;+this.value+&quot;%&quot;"></div><label class="switchrow">Exclude duplicates <input type="checkbox" checked></label><label class="switchrow">Exclude recently played <input type="checkbox" checked></label><button class="primary" style="width:100%;margin-top:20px" onclick="state.gen.name=document.getElementById(&quot;gname&quot;).value||&quot;My mix&quot;;state.step=3;runGeneration()">Generate playlist</button>':'')+(state.step===3?'<div class="panel"><div class="eyebrow">YOUR MIX IS READY</div><h2>'+g.name+'</h2><p class="sub">'+g.source+' · '+g.recipe+'</p><div class="progress"><span id="genbar" style="width:100%"></span></div><b>20 tracks selected</b><p class="sub">A balanced mix based on your listening patterns.</p></div>'+tracks.slice(0,6).map((t,i)=>row(t,i)).join('')+'<div class="actions"><button class="primary" onclick="saveGenerated()">Save playlist</button><button class="secondary" onclick="state.step=2;render()">Adjust</button><button class="secondary" onclick="runGeneration()">Regenerate</button></div>':'')+'<div class="actions">'+(state.step>0&&state.step<3?'<button class="secondary" onclick="state.step--;render()">Back</button>':'')+'</div>'}
function runGeneration(){state.genStatus="running";state.genProgress=0;state.step=3;render();let timer=setInterval(()=>{if(state.genStatus!=="running"){clearInterval(timer);return}state.genProgress=Math.min(100,state.genProgress+20);if(state.genProgress>=100)state.genStatus="done";render()},240)} function cancelGeneration(){state.genStatus="cancelled";state.step=2;render();toast("Generation cancelled")} function saveEditor(){let p=state.playlists.find(x=>x.id===state.playlistId);p.name=$("#editname").value.trim()||p.name;p.desc=$("#editdesc").value;back();toast("Changes saved")}
function saveGenerated(){let id=Date.now();state.playlists.unshift({id,name:state.gen.name,desc:state.gen.recipe+" · "+state.gen.source,ids:tracks.slice(0,6).map(t=>t.id),generated:true});toast("Saved to your playlists");state.tab="playlists";state.page="playlists";state.stack=[];render()}
function playlists(){return '<div class="eyebrow">YOUR COLLECTION</div><h1 class="h1">Playlists</h1><p class="sub">A place for every version of you.</p><div class="actions"><button class="primary" onclick="createPlaylist()">＋ New playlist</button><button class="secondary" onclick="state.filter=state.filter===\'All\'?&quot;Generated&quot;:&quot;All&quot;;render()">'+state.filter+' ▾</button></div><input class="search" placeholder="Find a playlist" oninput="state.search=this.value;render()">'+state.playlists.filter(p=>(state.filter==="All"||p.generated)&&p.name.toLowerCase().includes(state.search.toLowerCase())).map(p=>'<div class="row" onclick="push(\'playlist\',{playlistId:'+p.id+'})">'+img((tracks.find(t=>t.id===p.ids[0])||tracks[0]).art)+'<div class="meta"><b>'+p.name+'</b><small>'+p.ids.length+' tracks · '+(p.generated?"Generated":"Playlist")+'</small></div><button class="iconbtn" onclick="event.stopPropagation();playlistActions('+p.id+')">···</button></div>').join('')+'<div class="footerhint">Your playlists stay in this prototype session.</div>'}
function playlistDetail(){let p=state.playlists.find(x=>x.id===state.playlistId);if(!p)return '<div class="empty">Playlist not found</div>';let list=p.ids.map(id=>tracks.find(t=>t.id===id)).filter(Boolean);return '<div class="eyebrow">PLAYLIST</div><div class="hero">'+img((list[0]||tracks[0]).art,'art big')+'<div><h1>'+p.name+'</h1><div class="sub">'+p.desc+'</div><div class="sub">'+list.length+' tracks · '+list.reduce((s,t)=>s+t.mins,0)+' min</div></div></div><div class="actions"><button class="primary" onclick="play('+list[0].id+')">▶ Play</button><button class="secondary" onclick="toast(\'Shuffling playlist\')">Shuffle</button><button class="secondary" onclick="push(\'editor\')">Edit</button></div><div class="section"><h2>Tracks</h2><button class="link" onclick="push(\'addtracks\')">＋ Add tracks</button></div>'+list.map((t,i)=>row(t,i)).join('')+'<div class="section"><button class="link" onclick="sharePlaylist()">Share / export</button><button class="link" onclick="playlistActions('+p.id+')">More actions ···</button></div>'}
function createPlaylist(){showSheet("New playlist",'<div class="field"><label>Name</label><input id="newname" placeholder="Give it a name"></div><div class="field"><label>Description</label><input id="newdesc" placeholder="Optional"></div><button class="primary" onclick="let n=$(\'#newname\').value.trim();if(!n){toast(\'Enter a playlist name\');return}state.playlists.unshift({id:Date.now(),name:n,desc:$(\'#newdesc\').value,ids:[],generated:false});closeSheet();toast(\'Playlist created\')">Create playlist</button>')}
function playlistActions(id){showSheet('Playlist options','<button class="tile" style="width:100%;margin:5px 0" onclick="state.playlistId='+id+';push(\'editor\');closeSheet()">Edit playlist</button><button class="tile" style="width:100%;margin:5px 0" onclick="sharePlaylist();closeSheet()">Share / export</button><button class="danger" onclick="confirmDeletePlaylist('+id+')">Delete playlist</button>')} function confirmDeletePlaylist(id){showSheet('Delete playlist?','<p>This cannot be undone.</p><button class="danger" onclick="deletePlaylist('+id+')">Delete playlist</button>')} function deletePlaylist(id){state.playlists=state.playlists.filter(p=>p.id!==id);state.modal=null;state.page='playlists';state.tab='playlists';state.stack=[];render();toast('Playlist deleted')}
function editor(){let p=state.playlists.find(x=>x.id===state.playlistId);return '<div class="eyebrow">PLAYLIST EDITOR</div><h1 class="h1">Edit playlist</h1><div class="field"><label>Name</label><input id="editname" value="'+p.name+'"></div><div class="field"><label>Description</label><input id="editdesc" value="'+p.desc+'"></div><div class="section"><h2>Reorder tracks</h2><small class="muted">Use ↑ ↓</small></div>'+p.ids.map((id,i)=>{let t=tracks.find(x=>x.id===id);return '<div class="row">'+img(t.art)+'<div class="meta"><b>'+t.t+'</b><small>'+t.a+'</small></div><button class="iconbtn" onclick="moveTrack('+i+',-1)">↑</button><button class="iconbtn" onclick="moveTrack('+i+',1)">↓</button><button class="iconbtn" onclick="removeTrack('+id+')">×</button></div>'}).join('')+'<div class="actions"><button class="primary" onclick="saveEditor()">Save changes</button><button class="secondary" onclick="back()">Discard</button><button class="secondary" onclick="push(\'addtracks\')">Add tracks</button></div>'}
function moveTrack(i,d){let p=state.playlists.find(x=>x.id===state.playlistId),j=i+d;if(j<0||j>=p.ids.length)return;[p.ids[i],p.ids[j]]=[p.ids[j],p.ids[i]];render()}
function removeTrack(id){let p=state.playlists.find(x=>x.id===state.playlistId);p.ids=p.ids.filter(x=>x!==id);render();toast("Track removed")}
function addTracks(){return '<div class="eyebrow">YOUR LIBRARY</div><h1 class="h1">Add tracks</h1><input class="search" placeholder="Search tracks" oninput="state.search=this.value;render()">'+tracks.filter(t=>!state.search||t.t.toLowerCase().includes(state.search.toLowerCase())).map(t=>'<label class="row">'+img(t.art)+'<div class="meta"><b>'+t.t+'</b><small>'+t.a+'</small></div><input type="checkbox" value="'+t.id+'" '+(state.playlists.find(p=>p.id===state.playlistId).ids.includes(t.id)?'disabled':'')+'></label>').join('')+'<button class="primary" style="width:100%;margin-top:18px" onclick="let p=state.playlists.find(p=>p.id===state.playlistId);document.querySelectorAll(\'input[type=checkbox]:checked\').forEach(x=>{let id=+x.value;if(!p.ids.includes(id))p.ids.push(id)});back();toast(\'Tracks added\')">Add selected</button>'}
function connectScrobble(provider){let key=provider==="Last.fm"?"lastfm":"listenBrainz";showSheet("Connect "+provider,'<p>Authentication is represented as a preview only. No account credentials are collected or sent.</p><button class="primary" onclick="state.scrobble.'+key+'=true;closeSheet();toast(\'Demo connection enabled\')">Preview connected state</button>')}
function settings(){let s=state.scrobble;return `
<div class="eyebrow">ACCOUNT & SCROBBLING</div><h1 class="h1">Scrobbling</h1><p class="sub">Connect the services that keep track of what you listen to.</p>
<div class="section"><h2>Services</h2></div><div class="panel">
<div class="row"><div class="meta"><b>Last.fm</b><small>${s.lastfm?"Connected · Preview session":"Not connected"}</small></div><button class="secondary" onclick="connectScrobble('Last.fm')">${s.lastfm?"Reconnect":"Connect"}</button></div>
<div class="row"><div class="meta"><b>ListenBrainz</b><small>${s.listenBrainz?"Connected · Preview session":"Not connected"}</small></div><button class="secondary" onclick="connectScrobble('ListenBrainz')">${s.listenBrainz?"Reconnect":"Connect"}</button></div>
${s.lastfm?`<div class="switchrow"><div><b>Scrobble tracks</b><small>Send completed listens to Last.fm.</small></div><input type="checkbox" ${s.lastfmTracks?"checked":""} onchange="state.scrobble.lastfmTracks=this.checked"></div><div class="switchrow"><div><b>Primary artist only</b><small>Use the primary artist when scrobbling.</small></div><input type="checkbox" ${s.lastfmArtist?"checked":""} onchange="state.scrobble.lastfmArtist=this.checked"></div><div class="switchrow"><div><b>Now playing</b><small>Share the track currently playing.</small></div><input type="checkbox" ${s.lastfmNowPlaying?"checked":""} onchange="state.scrobble.lastfmNowPlaying=this.checked"></div>`:""}
${s.listenBrainz?`<div class="switchrow"><div><b>Primary artist only</b><small>Use the primary artist for ListenBrainz.</small></div><input type="checkbox" ${s.listenBrainzArtist?"checked":""} onchange="state.scrobble.listenBrainzArtist=this.checked"></div>`:""}
</div>
<div class="section"><h2>Scrobble timing</h2></div>
<div class="panel">${s.lastfm?`<div class="field"><label id="minDurationLabel">Minimum song duration · ${s.minDuration}s</label><input type="range" min="15" max="120" step="5" value="${s.minDuration}" oninput="state.scrobble.minDuration=+this.value;document.getElementById('minDurationLabel').textContent='Minimum song duration · '+this.value+'s'"></div><div class="field"><label id="delayLabel">Scrobble delay · ${s.delayPercent}%</label><input type="range" min="10" max="100" step="5" value="${s.delayPercent}" oninput="state.scrobble.delayPercent=+this.value;document.getElementById('delayLabel').textContent='Scrobble delay · '+this.value+'%'"></div><div class="field"><label id="maxDelayLabel">Maximum delay · ${s.maxDelay}s</label><input type="range" min="30" max="300" step="10" value="${s.maxDelay}" oninput="state.scrobble.maxDelay=+this.value;document.getElementById('maxDelayLabel').textContent='Maximum delay · '+this.value+'s'"></div>`:'<p class="sub">Connect Last.fm to configure minimum track duration and scrobble delay.</p>'}</div>
<p class="footerhint">Prototype preview · Provider authentication and scrobble delivery are not connected.</p>`}
function metric(i){if(i===0)push("toptracks");else if(i===1||i===5)push("history");else if(i===3)push("topartists");else if(i===4)push("topalbums");else push("toptracks")}
function period(p){if(p==="Custom"){showSheet("Custom date range",'<div class="field"><label>From</label><input type="date" id="from"></div><div class="field"><label>To</label><input type="date" id="to"></div><button class="primary" onclick="state.period=\'Custom\';closeSheet();render()">Apply range</button>')}else{state.period=p;render()}}
function sharePlaylist(){toast("Share sheet · copied playlist summary")}
function screen(){const total=state.period==="7 days"?128:state.period==="90 days"?1328:state.period==="1 year"?4892:412;const s=state.scrobble;return `
<section class="welcome"><div><div class="eyebrow">WEDNESDAY · YOUR MUSIC OVERVIEW</div><h1 class="h1">Your listening space</h1><div class="sub">Patterns, favourites and mixes that make your music yours.</div></div><div class="datechip">◷ &nbsp; Last 30 days</div></section>
<div class="stats">
<button class="metric" onclick="push('toptracks')"><div class="metricicon" style="background:#eeeaff;color:#7566e8">♫</div><span>Total plays</span><strong>${total.toLocaleString()}</strong><div class="trend">↗ 12% this period</div></button>
<button class="metric" onclick="push('history')"><div class="metricicon" style="background:#e4f7ef;color:#26946e">◷</div><span>Listening time</span><strong>86h 24m</strong><div class="trend">↗ 8% this period</div></button>
<button class="metric" onclick="push('topartists')"><div class="metricicon" style="background:#fff0e9;color:#e58a61">✳</div><span>Artists</span><strong>94</strong><div class="trend">+8 discovered</div></button>
<button class="metric" onclick="push('history')"><div class="metricicon" style="background:#e9f1ff;color:#5b8bdc">⌁</div><span>Listening streak</span><strong>12 days</strong><div class="trend">Best · 18 days</div></button></div>
<div class="layout"><div class="maincol">
<section class="card"><div class="cardhead"><h2>Listening activity</h2><div class="pills">${["7 days","30 days","90 days","1 year"].map(p=>'<button class="pill '+(state.period===p?'active':'')+'" onclick="period(\''+p+'\')">'+p+'</button>').join('')}</div></div><div class="chart">${[32,46,28,65,50,74,42,88,58,68,37,95,61,78].map((v,i)=>'<div class="bar '+(i===12?'sel':'')+'" style="height:'+v+'%" onclick="toast(\''+(i+1)+' days ago · '+v+' plays\')"></div>').join('')}</div><div class="chartlabels"><span>2 weeks ago</span><span>Today</span></div></section>
<section class="card"><div class="cardhead"><h2>Most played</h2><button class="link" onclick="push('toptracks')">View all ↗</button></div>${tracks.slice(0,4).map((t,i)=>row(t,i)).join('')}</section>
<section class="card"><div class="cardhead"><h2>Recently played</h2><button class="link" onclick="push('history')">Full history ↗</button></div>${tracks.slice(0,3).map(t=>'<div class="row" onclick="openItem(\'track\','+t.id+')">'+img(t.art)+'<div class="meta"><b>'+t.t+'</b><small>'+t.a+' · '+t.date+'</small></div></div>').join('')}</section>
</div><aside class="sidecol">
<section class="card gen-card"><div class="gen-orb">✳</div><div class="eyebrow" style="margin-top:14px;color:#7566e8">YOUR NEXT MIX</div><div class="gen-title">Make something yours.</div><p>Build a playlist from the music you love, with room for discovery.</p><div class="gen-controls"><div class="field"><label>START FROM</label><select id="dashsource" onchange="state.gen.source=this.value"><option>Listening history</option><option>Most played tracks</option><option>Favourite tracks</option><option>Favourite artists</option></select></div><div class="field"><label>RECIPE</label><select id="dashrecipe" onchange="state.gen.recipe=this.value"><option>Personal favourites</option><option>Forgotten favourites</option><option>Daily mix</option><option>Discovery mix</option><option>Artist-focused mix</option></select></div></div><div class="field"><label>PLAYLIST NAME</label><input id="dashname" value="Your next repeat"></div><button class="primary" style="width:100%" onclick="state.gen.source=document.getElementById('dashsource').value;state.gen.recipe=document.getElementById('dashrecipe').value;state.gen.name=document.getElementById('dashname').value||'Your next repeat';state.gen.count=20;runGeneration();showSheet('Building your mix','<p>Creating a demo playlist from your listening data.</p><div class=\'progress\'><span id=\'genbar\' style=\'width:15%\'></span></div><button class=\'secondary\' onclick=\'cancelGeneration();closeSheet()\'>Cancel</button>')">✳ &nbsp; Generate playlist</button><div class="footerhint">Preview only · Sample listening data</div></section>
<section class="card"><div class="cardhead"><h2>Your playlists</h2><button class="link" onclick="createPlaylist()">＋ New</button></div><div class="playlistgrid">${state.playlists.slice(0,4).map(p=>'<button class="playlisttile" onclick="push(\'playlist\',{playlistId:'+p.id+'})"><div class="coverstack">'+p.ids.slice(0,3).map(id=>{let t=tracks.find(x=>x.id===id)||tracks[0];return '<img src="'+t.art+'" alt="">'}).join('')+'</div><b>'+p.name+'</b><small>'+p.ids.length+' tracks</small></button>').join('')}</div><div class="actions"><button class="secondary" style="width:100%" onclick="state.page='playlists';render()">Manage playlists</button></div></section>
<section class="card"><div class="cardhead"><h2>Scrobbling services</h2><button class="link" onclick="push('settings')">Settings ↗</button></div>
<div class="service"><div class="serviceicon" style="background:#ffe9e7;color:#d84b40">L</div><div class="meta"><b>Last.fm</b><small>${s.lastfm?'Preview connected':'Not connected'}</small></div><span class="status ${s.lastfm?'on':''}">${s.lastfm?'ACTIVE':'OFF'}</span><button class="link" onclick="connectScrobble('Last.fm')">${s.lastfm?'Edit':'Connect'}</button></div>
<div class="service"><div class="serviceicon" style="background:#e8f5ff;color:#3982bd">B</div><div class="meta"><b>ListenBrainz</b><small>${s.listenBrainz?'Preview connected':'Not connected'}</small></div><span class="status ${s.listenBrainz?'on':''}">${s.listenBrainz?'ACTIVE':'OFF'}</span><button class="link" onclick="connectScrobble('ListenBrainz')">${s.listenBrainz?'Edit':'Connect'}</button></div>
<div class="switchrow"><div><b>Scrobble tracks</b><small>Send completed listens to connected services.</small></div><input type="checkbox" ${s.lastfmTracks?'checked':''} onchange="state.scrobble.lastfmTracks=this.checked"></div><div class="switchrow"><div><b>Now playing</b><small>Share the track currently playing.</small></div><input type="checkbox" ${s.lastfmNowPlaying?'checked':''} onchange="state.scrobble.lastfmNowPlaying=this.checked"></div><div class="footerhint">Authentication and delivery are simulated.</div></section>
</aside></div>`;}
function render(){app.innerHTML='<header class="top"><div class="brand"><span class="brandmark">♫</span> mylo <span style="font-size:11px;color:var(--muted);font-weight:650;letter-spacing:.08em">LISTENING STUDIO</span></div><div class="topright"><button class="iconbtn" onclick="push(\'settings\')" aria-label="Settings">⚙</button><div class="avatar">Z</div></div></header><main class="page">'+screen()+'</main>'+(state.page!=="home"?'<div class="mini" onclick="state.mini=!state.mini;render()">'+img(state.playing.art)+'<div class="meta"><b>'+state.playing.t+'</b><small>'+state.playing.a+'</small></div><button onclick="event.stopPropagation();toast(\'Playback toggled\')">Ⅱ</button><button onclick="event.stopPropagation();toast(\'Next track\')">≫</button></div>':'')+(state.modal?'<div class="sheetback" onclick="if(event.target===this)closeSheet()"><section class="sheet"><h2>'+state.modal.title+'</h2>'+state.modal.body+'<button class="link" style="margin-top:12px" onclick="closeSheet()">Close</button></section></div>':'')+(state.toast?'<div class="toast">'+state.toast+'</div>':'')}
render();
</script></body></html>

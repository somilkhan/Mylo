<style>

.layout{display:flex;flex-direction:column;gap:20px}.maincol,.sidecol{display:flex;flex-direction:column;gap:20px;min-width:0}.card{background:transparent;border:0;border-radius:0;padding:0;box-shadow:none;min-width:0}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 20px 9px}.cardhead h2{font-size:13px;line-height:1.3;color:var(--muted);letter-spacing:.02em;text-transform:uppercase;margin:0;font-weight:650}.link{border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:6px}.pills{display:flex;gap:4px;overflow:auto}.pill{white-space:nowrap;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:6px 8px;font-size:11px;font-weight:600}.pill.active{background:var(--surface2);color:var(--ink)}
.chart{height:118px;display:flex;align-items:end;gap:8px;padding:14px 20px 5px;background:var(--surface);border-radius:14px;margin:0 12px}.bar{flex:1;border-radius:4px 4px 1px 1px;background:#48484a;min-height:6px;cursor:pointer}.bar.sel{background:#fff}.chartlabels{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;padding:7px 20px 0}

.primary,.secondary,.danger{border:0;border-radius:22px;padding:11px 18px;font-size:14px;font-weight:650;min-height:42px}.primary{background:#fff;color:#000}.secondary{background:var(--surface2);color:#fff}.danger{background:#3b171b;color:#ff6b76}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 20px}.gen-card{background:var(--surface);border-radius:16px;padding:18px 0}.gen-orb{display:none}.gen-title{font-size:22px;line-height:1.15;letter-spacing:-.4px;font-weight:750;margin:7px 20px 5px}.gen-card p{font-size:13px;color:var(--muted);margin:0 20px 10px}.gen-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}.field{display:grid;gap:6px;margin:12px 20px}.gen-controls .field{margin:12px 0}.field label{font-size:11px;color:var(--muted);font-weight:600}.field input,.field select{background:var(--surface2);color:var(--ink);border:1px solid var(--line);padding:11px 12px;border-radius:9px;width:100%;font-size:14px}.gen-card>.primary{margin:0 20px;width:calc(100% - 40px)!important}
.playlistgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 20px}.playlisttile{border:0;background:var(--surface);border-radius:12px;padding:11px;text-align:left;min-width:0}.coverstack{display:flex;margin-bottom:10px}.coverstack img{width:39px;height:39px;border-radius:4px;object-fit:cover;border:1px solid var(--bg);margin-right:-7px}.playlisttile b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}.playlisttile small{font-size:12px;color:var(--muted)}
.service{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line);min-height:66px}.serviceicon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:750;background:var(--surface2)!important;color:var(--ink)!important}.status{font-size:11px;font-weight:600;padding:4px 7px;border-radius:6px;background:var(--surface2);color:var(--muted)}.status.on{background:#173326;color:#8de0b4}.switchrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line)}.switchrow b{font-size:14px;font-weight:550}.switchrow small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.switchrow input{appearance:none;width:46px;height:28px;border-radius:99px;background:#39393d;position:relative;flex:none;transition:background .18s}.switchrow input:before{content:"";position:absolute;width:24px;height:24px;left:2px;top:2px;border-radius:50%;background:#fff;transition:transform .18s}.switchrow input:checked{background:#30d158}.switchrow input:checked:before{transform:translateX(18px)}
.footerhint{font-size:11px;color:var(--muted);text-align:left;margin:12px 20px 0}.mini{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 24px));z-index:8;background:#252527ed;backdrop-filter:blur(22px);border:1px solid #454548;border-radius:15px;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px #0008}.mini .art{width:40px;height:40px;border-radius:5px}.mini button{border:0;background:none;padding:7px;font-size:17px}.sheetback{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:end;justify-content:center;backdrop-filter:blur(5px)}.sheet{width:min(600px,100%);max-height:88vh;overflow:auto;background:#1c1c1e;border:1px solid #38383a;border-bottom:0;border-radius:22px 22px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 35px #0007;animation:up .22s ease}.sheet:before{content:"";display:block;width:36px;height:5px;border-radius:9px;background:#636366;margin:-10px auto 20px}.sheet h2{margin:0 0 6px;font-size:22px;letter-spacing:-.4px;font-weight:750}.sheet p{color:var(--muted);font-size:14px}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#303033;color:#fff;border:1px solid #48484b;border-radius:12px;padding:10px 16px;font-size:12px;z-index:30}.progress{height:5px;background:#3a3a3c;border-radius:10px;overflow:hidden;margin:15px 0}.progress span{display:block;height:100%;background:#fff;width:0}.empty{text-align:center;padding:28px;color:var(--muted)}@keyframes up{from{transform:translateY(25px);opacity:.8}to{transform:none;opacity:1}}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#fff;--surface:#f7f7f9;--surface2:#f2f2f7;--ink:#000;--muted:#6e6e73;--line:#e5e5ea}.bar{background:#c7c7cc}.bar.sel{background:#000}.primary{background:#000;color:#fff}.mini{background:#f2f2f7ed;border-color:#dedee3}.mini button{color:#000}.sheet{background:#f7f7f9;border-color:#e5e5ea}.sheet:before{background:#c7c7cc}.toast{background:#252527}}
@media(min-width:700px){.app{max-width:600px;border-left:1px solid #161618;border-right:1px solid #161618}.stats{margin-left:0;margin-right:0}.layout{padding-bottom:10px}}
@media(max-width:440px){.h1{font-size:32px}.gen-controls{grid-template-columns:1fr}.playlistgrid{gap:8px}.cardhead{align-items:center}}
</style></head>

<script>

let state={tab:"stats",page:"stats",stack:[],tabPages:{stats:{page:"stats",stack:[]},generate:{page:"generate",stack:[]},playlists:{page:"playlists",stack:[]}},period:"30 days",search:"",sort:"Plays",theme:"dark",glass:true,mini:false,scrobble:{listenBrainz:false,lastfm:false,lastfmTracks:true,lastfmArtist:true,lastfmNowPlaying:true,listenBrainzArtist:true,minDuration:30,delayPercent:50,maxDelay:120},playing:tracks[0],queue:[],favs:new Set([1,4]),playlists:[{id:1,name:"Late night loop",desc:"For the hours after midnight.",ids:[4,5,6],generated:false},{id:2,name:"On repeat",desc:"The songs that stay.",ids:[1,2,3],generated:false}],draft:null,gen:{source:"Listening history",recipe:"Personal favourites",count:20,name:"Your next repeat",range:"Last 90 days",diversity:65,discovery:35},step:0,modal:null,toast:"",filter:"All"};
const $=s=>document.querySelector(s),app=$("#app");
function push(page,data={}){state.stack.push({page:state.page,tab:state.tab});state.page=page;Object.assign(state,data);render()}
function back(){if(state.modal){state.modal=null;render();return}let p=state.stack.pop();if(p){state.page=p.page;state.tab=p.tab;render()}else if(state.page!=="home"){state.page="home";render()}else toast("You're at the start")}
function toast(msg){state.toast=msg;render();setTimeout(()=>{state.toast="";render()},1800)}
function img(src,cls="art"){return '<img class="'+cls+'" src="'+src+'" onerror="this.style.opacity=.15" alt="">'}
function row(t,i,kind="track"){let title=kind==="track"?t.t:t.name,sub=kind==="track"?t.a:(kind==="artist"?"Artist":t.artist),art=t.art;return '<div class="row" onclick="openItem(\''+kind+'\','+(t.id||i)+')">'+img(art)+'<div class="meta"><b>'+title+'</b><small>'+sub+'</small></div><div class="right">'+(t.plays||"")+'<br><span>plays</span></div><button class="iconbtn" onclick="event.stopPropagation();actions(\''+kind+'\','+(t.id||i)+')">···</button></div>'}
function openItem(kind,id){if(kind==="track")push("track",{item:tracks.find(x=>x.id===id)});else if(kind==="artist")push("artist",{item:artists.find(x=>x.name===id)||artists[id]});else push("album",{item:albums.find(x=>x.name===id)||albums[id]})}
function actions(kind,id){let t=kind==="track"?tracks.find(x=>x.id===id):null;showSheet(kind==="track"?"Track actions":kind+" actions",'<div class="actions"><button class="primary" onclick="play('+id+')">Play now</button><button class="secondary" onclick="queue('+id+')">Add to queue</button></div><div class="row" onclick="toast(\'Added to favourites\');closeSheet()"><div class="meta"><b>♡  '+(t&&state.favs.has(id)?"Remove favourite":"Add to favourites")+'</b><small>Keep it close</small></div></div><div class="row" onclick="push(\'track\',{item:tracks.find(x=>x.id==='+id+')});closeSheet()"><div class="meta"><b>Track details</b></div></div>')}
function play(id){state.playing=tracks.find(x=>x.id===id)||state.playing;toast("Now playing · "+state.playing.t)}
function queue(id){state.queue.push(tracks.find(x=>x.id===id));toast("Added to queue")}

function header(){let root=["stats","generate","playlists"].includes(state.page);return '<header class="top"><button class="iconbtn" onclick="back()" style="visibility:'+(root?"hidden":"visible")+'">‹</button><span class="brand">MYLO</span><button class="iconbtn" onclick="push(\'settings\')">⚙</button></header>'}
function stats(){let total=state.period==="7 days"?128:state.period==="90 days"?1328:state.period==="1 year"?4892:state.period==="All time"?12480:412;return '<div class="eyebrow">YOUR LISTENING, IN FOCUS</div><h1 class="h1">Statistics</h1><p class="sub">A little more of what you love.</p><div class="pills" style="margin:20px 0 14px">'+["7 days","30 days","90 days","1 year","All time","Custom"].map(p=>'<button class="pill '+(state.period===p?'active':'')+'" onclick="period(\''+p+'\')">'+p+'</button>').join('')+'</div><div class="stats">'+[['Plays',total.toLocaleString(),'↗ 12%','tracks'],['Listening time','86h 24m','↗ 8%','time'],['Unique tracks','312','+24 this period','tracks'],['Artists','94','+8 this period','artists'],['Albums','126','+11 this period','albums'],['Streak','12 days','Personal best · 18','history']].map((m,i)=>'<button class="metric" onclick="metric('+i+')"><span>'+m[0]+'</span><strong>'+m[1]+'</strong><span>'+m[2]+'</span></button>').join('')+'</div><div class="section"><h2>Listening activity</h2><button class="link" onclick="push(\'history\')">History ↗</button></div><div class="panel"><div style="display:flex;justify-content:space-between"><b>Daily plays</b><small class="muted">Last 14 days</small></div><div class="chart">'+[32,46,28,65,50,74,42,88,58,68,37,95,61,78].map((v,i)=>'<div class="bar '+(i===12?'sel':'')+'" style="height:'+v+'%" onclick="toast(\''+(i+1)+' days ago · '+v+' plays\')"></div>').join('')+'</div><div class="chartlabels"><span>14 days ago</span><span>Today</span></div></div><div class="section"><h2>Most played</h2><button class="link" onclick="push(\'toptracks\')">See all ↗</button></div>'+tracks.slice(0,4).map((t,i)=>row(t,i)).join('')+'<div class="section"><h2>Top artists</h2><button class="link" onclick="push(\'topartists\')">See all ↗</button></div>'+artists.slice(0,3).map((t,i)=>row(t,i,"artist")).join('')+'<div class="section"><h2>Top albums</h2><button class="link" onclick="push(\'topalbums\')">See all ↗</button></div>'+albums.slice(0,3).map((t,i)=>row(t,i,"album")).join('')+'<div class="section"><h2>Recent listening</h2><button class="link" onclick="push(\'history\')">Full history ↗</button></div>'+tracks.slice(0,3).map((t,i)=>'<div class="row" onclick="openItem(\'track\','+t.id+')">'+img(t.art)+'<div class="meta"><b>'+t.t+'</b><small>'+t.date+'</small></div></div>').join('')}
function listPage(kind){let data=kind==="toptracks"?tracks:kind==="topartists"?artists:albums;let q=state.search.toLowerCase();data=data.filter(x=>(x.t||x.name).toLowerCase().includes(q)||(x.a||x.artist||"").toLowerCase().includes(q));if(state.sort==="A–Z")data=[...data].sort((a,b)=>(a.t||a.name).localeCompare(b.t||b.name));else data=[...data].sort((a,b)=>(b.plays||0)-(a.plays||0));let title=kind==="toptracks"?"Top tracks":kind==="topartists"?"Top artists":"Top albums";return '<div class="eyebrow">STATISTICS</div><h1 class="h1">'+title+'</h1><input class="search" placeholder="Search '+title.toLowerCase()+'" value="'+state.search+'" oninput="state.search=this.value;render()"><div class="pills"><button class="pill active" onclick="state.sort=\'Plays\';render()">Most played</button><button class="pill" onclick="state.sort=\'A–Z\';render()">A–Z</button><button class="pill" onclick="toast(\'Period: \'+state.period)">Period · '+state.period+'</button></div>'+data.map((x,i)=>row(x,i,kind==="toptracks"?"track":kind==="topartists"?"artist":"album")).join('')}
function historyPage(){return '<div class="eyebrow">LISTENING HISTORY</div><h1 class="h1">History</h1><div class="pills" style="margin:16px 0 10px"><button class="pill active" onclick="toast(\'Year · 2026\')">2026 ▾</button><button class="pill" onclick="toast(\'Month · November\')">November ▾</button></div><input class="search" type="date" aria-label="Filter by date" onchange="state.selectedDate=this.value;toast(\'Date filter updated\')"><input class="search" placeholder="Search history" oninput="state.search=this.value;render()"><div class="section"><h2>Today</h2><small class="muted">18 November</small></div>'+tracks.filter(t=>t.date.startsWith("Today")&&(!state.search||t.t.toLowerCase().includes(state.search.toLowerCase())||t.a.toLowerCase().includes(state.search.toLowerCase()))).map(t=>'<div class="row" onclick="openItem(\'track\','+t.id+')">'+img(t.art)+'<div class="meta"><b>'+t.t+'</b><small>'+t.a+'</small></div><small class="right">'+t.date.split("·")[1]+'</small><button class="iconbtn" onclick="event.stopPropagation();actions(\'track\','+t.id+')">···</button></div>').join('')+'<div class="section"><h2>Yesterday</h2><small class="muted">17 November</small></div>'+tracks.filter(t=>t.date.startsWith("Yesterday")&&(!state.search||t.t.toLowerCase().includes(state.search.toLowerCase())||t.a.toLowerCase().includes(state.search.toLowerCase()))).map(t=>'<div class="row" onclick="openItem(\'track\','+t.id+')">'+img(t.art)+'<div class="meta"><b>'+t.t+'</b><small>'+t.a+'</small></div><small class="right">'+t.date.split("·")[1]+'</small><button class="iconbtn" onclick="event.stopPropagation();actions(\'track\','+t.id+')">···</button></div>').join('')+'<div class="section"><h2>Earlier</h2></div>'+tracks.filter(t=>!t.date.startsWith("Today")&&!t.date.startsWith("Yesterday")&&(!state.search||t.t.toLowerCase().includes(state.search.toLowerCase())||t.a.toLowerCase().includes(state.search.toLowerCase()))).map(t=>'<div class="row" onclick="openItem(\'track\','+t.id+')">'+img(t.art)+'<div class="meta"><b>'+t.t+'</b><small>'+t.a+'</small></div><small class="right">'+t.date+'</small><button class="iconbtn" onclick="event.stopPropagation();actions(\'track\','+t.id+')">···</button></div>').join('')}
function detail(kind){let t=state.item||tracks[0],isTrack=kind==="track";let name=isTrack?t.t:t.name,sub=isTrack?t.a:(kind==="artist"?"Artist":t.artist);let art=t.art||tracks[0].art;let related=isTrack?tracks.filter(x=>x.a===t.a):tracks.filter(x=>kind==="artist"?x.a===name:x.al===name);return '<div class="eyebrow">LIBRARY / '+kind.toUpperCase()+'</div><div class="hero">'+img(art,'art big')+'<div><h1>'+name+'</h1><div class="sub">'+sub+'</div><div class="sub" style="margin-top:7px">'+(t.plays||60)+' plays · '+(t.dur||"3:54")+'</div></div></div><div class="actions"><button class="primary" onclick="play('+(t.id||1)+')">▶ Play</button><button class="secondary" onclick="toast(\'Shuffling '+name+'\')">Shuffle</button><button class="secondary" onclick="toast(\'Added to queue\')">＋ Queue</button></div><div class="stats"><div class="metric"><span>Total plays</span><strong>'+(t.plays||60)+'</strong></div><div class="metric"><span>Listening time</span><strong>4h 32m</strong></div></div><div class="section"><h2>'+(isTrack?"Listening history":"Top tracks")+'</h2></div>'+related.map((x,i)=>row(x,i)).join('')+'<div class="panel" style="margin-top:20px"><span class="muted">First played</span><b style="float:right">Jan 12, 2025</b><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><span class="muted">Last played</span><b style="float:right">Today</b></div>'}
function generate(){let g=state.gen;return '<div class="eyebrow">MADE FROM YOUR LISTENS</div><h1 class="h1">Generate</h1><p class="sub">A playlist that sounds like you.</p><div class="step">'+[0,1,2,3].map(i=>'<i class="'+(state.step>=i?'on':'')+'"></i>').join('')+'</div>'+ (state.step===0?'<h2>Choose a source</h2><p class="sub">Start with the part of your library you want to explore.</p>'+["Listening history","Most played tracks","Favourite tracks","Favourite artists","Favourite albums","Existing playlists","Manually selected tracks"].map((x,i)=>'<button class="tile" style="width:100%;min-height:0;margin:5px 0" onclick="state.gen.source=\''+x+'\';state.step=1;render()"><b>'+(i+1)+'. '+x+'</b><small>'+(i===0?"Build from everything you have listened to":i===1?"Your most replayed tracks":"Use your saved "+x.toLowerCase())+'</small></button>').join(''):'')+(state.step===1?'<h2>Choose a recipe</h2><p class="sub">A starting point. You can tune the result next.</p>'+["Personal favourites","Forgotten favourites","Daily mix","Artist-focused mix","Discovery mix","Similar tracks","Time-period mix","Listening-history mix"].map((x,i)=>'<button class="tile" style="width:100%;min-height:0;margin:5px 0" onclick="state.gen.recipe=\''+x+'\';state.step=2;render()"><b>'+x+'</b><small>'+["Your most-loved tracks, balanced across artists.","Loved before, missing from recent rotation.","A fresh set for today.","Go deeper with artists you return to.","A little unfamiliar, still your taste.","Find adjacent sounds from familiar tracks.","A snapshot from a chosen era.","A mix shaped by a listening period."][i]+'</small></button>').join(''):'')+(state.step===2?'<h2>Shape your mix</h2><div class="field"><label>Playlist name</label><input id="gname" value="'+g.name+'"></div><div class="field"><label>Tracks · '+g.count+'</label><input type="range" min="10" max="60" step="5" value="'+g.count+'" oninput="state.gen.count=+this.value;this.previousElementSibling.textContent=&quot;Tracks · &quot;+this.value"></div><div class="field"><label>Date range</label><select onchange="state.gen.range=this.value"><option>Last 90 days</option><option>Last 30 days</option><option>All time</option><option>Last year</option></select></div><div class="field"><label>Familiarity · '+g.diversity+'%</label><input type="range" min="0" max="100" value="'+g.diversity+'" oninput="state.gen.diversity=+this.value;this.previousElementSibling.textContent=&quot;Familiarity · &quot;+this.value+&quot;%&quot;"></div><div class="field"><label>Discovery · '+g.discovery+'%</label><input type="range" min="0" max="100" value="'+g.discovery+'" oninput="state.gen.discovery=+this.value;this.previousElementSibling.textContent=&quot;Discovery · &quot;+this.value+&quot;%&quot;"></div><label class="switchrow">Exclude duplicates <input type="checkbox" checked></label><label class="switchrow">Exclude recently played <input type="checkbox" checked></label><button class="primary" style="width:100%;margin-top:20px" onclick="state.gen.name=document.getElementById(&quot;gname&quot;).value||&quot;My mix&quot;;state.step=3;runGeneration()">Generate playlist</button>':'')+(state.step===3?'<div class="panel"><div class="eyebrow">YOUR MIX IS READY</div><h2>'+g.name+'</h2><p class="sub">'+g.source+' · '+g.recipe+'</p><div class="progress"><span id="genbar" style="width:100%"></span></div><b>20 tracks selected</b><p class="sub">A balanced mix based on your listening patterns.</p></div>'+tracks.slice(0,6).map((t,i)=>row(t,i)).join('')+'<div class="actions"><button class="primary" onclick="saveGenerated()">Save playlist</button><button class="secondary" onclick="state.step=2;render()">Adjust</button><button class="secondary" onclick="runGeneration()">Regenerate</button></div>':'')+'<div class="actions">'+(state.step>0&&state.step<3?'<button class="secondary" onclick="state.step--;render()">Back</button>':'')+'</div>'}
function runGeneration(){state.genStatus="running";state.genProgress=0;state.step=3;render();let timer=setInterval(()=>{if(state.genStatus!=="running"){clearInterval(timer);return}state.genProgress=Math.min(100,state.genProgress+20);if(state.genProgress>=100)state.genStatus="done";render()},240)} function cancelGeneration(){state.genStatus="cancelled";state.step=2;render();toast("Generation cancelled")} function saveEditor(){let p=state.playlists.find(x=>x.id===state.playlistId);p.name=$("#editname").value.trim()||p.name;p.desc=$("#editdesc").value;back();toast("Changes saved")}
function saveGenerated(){let id=Date.now();state.playlists.unshift({id,name:state.gen.name,desc:state.gen.recipe+" · "+state.gen.source,ids:tracks.slice(0,6).map(t=>t.id),generated:true});toast("Saved to your playlists");state.tab="playlists";state.page="playlists";state.stack=[];render()}
function playlists(){return '<div class="eyebrow">YOUR COLLECTION</div><h1 class="h1">Playlists</h1><p class="sub">A place for every version of you.</p><div class="actions"><button class="primary" onclick="createPlaylist()">＋ New playlist</button><button class="secondary" onclick="state.filter=state.filter===\'All\'?&quot;Generated&quot;:&quot;All&quot;;render()">'+state.filter+' ▾</button></div><input class="search" placeholder="Find a playlist" oninput="state.search=this.value;render()">'+state.playlists.filter(p=>(state.filter==="All"||p.generated)&&p.name.toLowerCase().includes(state.search.toLowerCase())).map(p=>'<div class="row" onclick="push(\'playlist\',{playlistId:'+p.id+'})">'+img((tracks.find(t=>t.id===p.ids[0])||tracks[0]).art)+'<div class="meta"><b>'+p.name+'</b><small>'+p.ids.length+' tracks · '+(p.generated?"Generated":"Playlist")+'</small></div><button class="iconbtn" onclick="event.stopPropagation();playlistActions('+p.id+')">···</button></div>').join('')+'<div class="footerhint">Your playlists stay in this prototype session.</div>'}
function playlistDetail(){let p=state.playlists.find(x=>x.id===state.playlistId);if(!p)return '<div class="empty">Playlist not found</div>';let list=p.ids.map(id=>tracks.find(t=>t.id===id)).filter(Boolean);return '<div class="eyebrow">PLAYLIST</div><div class="hero">'+img((list[0]||tracks[0]).art,'art big')+'<div><h1>'+p.name+'</h1><div class="sub">'+p.desc+'</div><div class="sub">'+list.length+' tracks · '+list.reduce((s,t)=>s+t.mins,0)+' min</div></div></div><div class="actions"><button class="primary" onclick="play('+list[0].id+')">▶ Play</button><button class="secondary" onclick="toast(\'Shuffling playlist\')">Shuffle</button><button class="secondary" onclick="push(\'editor\')">Edit</button></div><div class="section"><h2>Tracks</h2><button class="link" onclick="push(\'addtracks\')">＋ Add tracks</button></div>'+list.map((t,i)=>row(t,i)).join('')+'<div class="section"><button class="link" onclick="sharePlaylist()">Share / export</button><button class="link" onclick="playlistActions('+p.id+')">More actions ···</button></div>'}
function createPlaylist(){showSheet("New playlist",'<div class="field"><label>Name</label><input id="newname" placeholder="Give it a name"></div><div class="field"><label>Description</label><input id="newdesc" placeholder="Optional"></div><button class="primary" onclick="let n=$(\'#newname\').value.trim();if(!n){toast(\'Enter a playlist name\');return}state.playlists.unshift({id:Date.now(),name:n,desc:$(\'#newdesc\').value,ids:[],generated:false});closeSheet();toast(\'Playlist created\')">Create playlist</button>')}
function playlistActions(id){showSheet('Playlist options','<button class="tile" style="width:100%;margin:5px 0" onclick="state.playlistId='+id+';push(\'editor\');closeSheet()">Edit playlist</button><button class="tile" style="width:100%;margin:5px 0" onclick="sharePlaylist();closeSheet()">Share / export</button><button class="danger" onclick="confirmDeletePlaylist('+id+')">Delete playlist</button>')} function confirmDeletePlaylist(id){showSheet('Delete playlist?','<p>This cannot be undone.</p><button class="danger" onclick="deletePlaylist('+id+')">Delete playlist</button>')} function deletePlaylist(id){state.playlists=state.playlists.filter(p=>p.id!==id);state.modal=null;state.page='playlists';state.tab='playlists';state.stack=[];render();toast('Playlist deleted')}
function editor(){let p=state.playlists.find(x=>x.id===state.playlistId);return '<div class="eyebrow">PLAYLIST EDITOR</div><h1 class="h1">Edit playlist</h1><div class="field"><label>Name</label><input id="editname" value="'+p.name+'"></div><div class="field"><label>Description</label><input id="editdesc" value="'+p.desc+'"></div><div class="section"><h2>Reorder tracks</h2><small class="muted">Use ↑ ↓</small></div>'+p.ids.map((id,i)=>{let t=tracks.find(x=>x.id===id);return '<div class="row">'+img(t.art)+'<div class="meta"><b>'+t.t+'</b><small>'+t.a+'</small></div><button class="iconbtn" onclick="moveTrack('+i+',-1)">↑</button><button class="iconbtn" onclick="moveTrack('+i+',1)">↓</button><button class="iconbtn" onclick="removeTrack('+id+')">×</button></div>'}).join('')+'<div class="actions"><button class="primary" onclick="saveEditor()">Save changes</button><button class="secondary" onclick="back()">Discard</button><button class="secondary" onclick="push(\'addtracks\')">Add tracks</button></div>'}
function moveTrack(i,d){let p=state.playlists.find(x=>x.id===state.playlistId),j=i+d;if(j<0||j>=p.ids.length)return;[p.ids[i],p.ids[j]]=[p.ids[j],p.ids[i]];render()}
function removeTrack(id){let p=state.playlists.find(x=>x.id===state.playlistId);p.ids=p.ids.filter(x=>x!==id);render();toast("Track removed")}
function addTracks(){return '<div class="eyebrow">YOUR LIBRARY</div><h1 class="h1">Add tracks</h1><input class="search" placeholder="Search tracks" oninput="state.search=this.value;render()">'+tracks.filter(t=>!state.search||t.t.toLowerCase().includes(state.search.toLowerCase())).map(t=>'<label class="row">'+img(t.art)+'<div class="meta"><b>'+t.t+'</b><small>'+t.a+'</small></div><input type="checkbox" value="'+t.id+'" '+(state.playlists.find(p=>p.id===state.playlistId).ids.includes(t.id)?'disabled':'')+'></label>').join('')+'<button class="primary" style="width:100%;margin-top:18px" onclick="let p=state.playlists.find(p=>p.id===state.playlistId);document.querySelectorAll(\'input[type=checkbox]:checked\').forEach(x=>{let id=+x.value;if(!p.ids.includes(id))p.ids.push(id)});back();toast(\'Tracks added\')">Add selected</button>'}
function connectScrobble(provider){let key=provider==="Last.fm"?"lastfm":"listenBrainz";showSheet("Connect "+provider,'<p>Authentication is represented as a preview only. No account credentials are collected or sent.</p><button class="primary" onclick="state.scrobble.'+key+'=true;closeSheet();toast(\'Demo connection enabled\')">Preview connected state</button>')}
function settings(){let s=state.scrobble;return `
<div class="eyebrow">ACCOUNT & SCROBBLING</div><h1 class="h1">Scrobbling</h1><p class="sub">Connect the services that keep track of what you listen to.</p>
<div class="section"><h2>Services</h2></div><div class="panel">
<div class="row"><div class="meta"><b>Last.fm</b><small>${s.lastfm?"Connected · Preview session":"Not connected"}</small></div><button class="secondary" onclick="connectScrobble('Last.fm')">${s.lastfm?"Reconnect":"Connect"}</button></div>
<div class="row"><div class="meta"><b>ListenBrainz</b><small>${s.listenBrainz?"Connected · Preview session":"Not connected"}</small></div><button class="secondary" onclick="connectScrobble('ListenBrainz')">${s.listenBrainz?"Reconnect":"Connect"}</button></div>
${s.lastfm?`<div class="switchrow"><div><b>Scrobble tracks</b><small>Send completed listens to Last.fm.</small></div><input type="checkbox" ${s.lastfmTracks?"checked":""} onchange="state.scrobble.lastfmTracks=this.checked"></div><div class="switchrow"><div><b>Primary artist only</b><small>Use the primary artist when scrobbling.</small></div><input type="checkbox" ${s.lastfmArtist?"checked":""} onchange="state.scrobble.lastfmArtist=this.checked"></div><div class="switchrow"><div><b>Now playing</b><small>Share the track currently playing.</small></div><input type="checkbox" ${s.lastfmNowPlaying?"checked":""} onchange="state.scrobble.lastfmNowPlaying=this.checked"></div>`:""}
${s.listenBrainz?`<div class="switchrow"><div><b>Primary artist only</b><small>Use the primary artist for ListenBrainz.</small></div><input type="checkbox" ${s.listenBrainzArtist?"checked":""} onchange="state.scrobble.listenBrainzArtist=this.checked"></div>`:""}
</div>
<div class="section"><h2>Scrobble timing</h2></div>
<div class="panel">${s.lastfm?`<div class="field"><label id="minDurationLabel">Minimum song duration · ${s.minDuration}s</label><input type="range" min="15" max="120" step="5" value="${s.minDuration}" oninput="state.scrobble.minDuration=+this.value;document.getElementById('minDurationLabel').textContent='Minimum song duration · '+this.value+'s'"></div><div class="field"><label id="delayLabel">Scrobble delay · ${s.delayPercent}%</label><input type="range" min="10" max="100" step="5" value="${s.delayPercent}" oninput="state.scrobble.delayPercent=+this.value;document.getElementById('delayLabel').textContent='Scrobble delay · '+this.value+'%'"></div><div class="field"><label id="maxDelayLabel">Maximum delay · ${s.maxDelay}s</label><input type="range" min="30" max="300" step="10" value="${s.maxDelay}" oninput="state.scrobble.maxDelay=+this.value;document.getElementById('maxDelayLabel').textContent='Maximum delay · '+this.value+'s'"></div>`:'<p class="sub">Connect Last.fm to configure minimum track duration and scrobble delay.</p>'}</div>
<p class="footerhint">Prototype preview · Provider authentication and scrobble delivery are not connected.</p>`}
function metric(i){if(i===0)push("toptracks");else if(i===1||i===5)push("history");else if(i===3)push("topartists");else if(i===4)push("topalbums");else push("toptracks")}
function period(p){if(p==="Custom"){showSheet("Custom date range",'<div class="field"><label>From</label><input type="date" id="from"></div><div class="field"><label>To</label><input type="date" id="to"></div><button class="primary" onclick="state.period=\'Custom\';closeSheet();render()">Apply range</button>')}else{state.period=p;render()}}
function sharePlaylist(){toast("Share sheet · copied playlist summary")}
function screen(){const total=state.period==="7 days"?128:state.period==="90 days"?1328:state.period==="1 year"?4892:412;const s=state.scrobble;return `
<section class="welcome"><div class="eyebrow">MYLO · LISTENING</div><h1 class="h1">Scrobbling</h1><div class="sub">Your listening activity, mixes and connected services.</div></section>
<div class="stats">
<button class="metric" onclick="push('toptracks')"><span>Total plays</span><strong>${total.toLocaleString()}</strong><div class="trend">This period</div></button>
<button class="metric" onclick="push('history')"><span>Listening time</span><strong>86h 24m</strong><div class="trend">Across your library</div></button>
<button class="metric" onclick="push('topartists')"><span>Artists played</span><strong>94</strong><div class="trend">This period</div></button>
<button class="metric" onclick="push('history')"><span>Current streak</span><strong>12 days</strong><div class="trend">Personal best · 18 days</div></button>
</div>
<div class="layout"><div class="maincol">
<section class="card"><div class="cardhead"><h2>Listening activity</h2><div class="pills">${["7 days","30 days","90 days","1 year"].map(p=>'<button class="pill '+(state.period===p?'active':'')+'" onclick="period(\''+p+'\')">'+p+'</button>').join('')}</div></div><div class="chart">${[32,46,28,65,50,74,42,88,58,68,37,95,61,78].map((v,i)=>'<div class="bar '+(i===12?'sel':'')+'" style="height:'+v+'%" onclick="toast(\''+(i+1)+' days ago · '+v+' plays\')"></div>').join('')}</div><div class="chartlabels"><span>2 weeks ago</span><span>Today</span></div></section>
<section class="card"><div class="cardhead"><h2>Recently played</h2><button class="link" onclick="push('history')">See all</button></div>${tracks.slice(0,5).map((t,i)=>row(t,i)).join('')}</section>
<section class="card"><div class="cardhead"><h2>Top tracks</h2><button class="link" onclick="push('toptracks')">See all</button></div>${tracks.slice(2,6).map((t,i)=>row(t,i)).join('')}</section>
</div><aside class="sidecol">
<section class="card"><div class="cardhead"><h2>Playlist generator</h2></div><div class="gen-card"><div class="gen-title">Made from your listening.</div><p>Turn your history and favourites into a playlist.</p><div class="gen-controls"><div class="field"><label>SOURCE</label><select id="dashsource" onchange="state.gen.source=this.value"><option>Listening history</option><option>Most played tracks</option><option>Favourite tracks</option><option>Favourite artists</option></select></div><div class="field"><label>TYPE</label><select id="dashrecipe" onchange="state.gen.recipe=this.value"><option>Personal favourites</option><option>Forgotten favourites</option><option>Daily mix</option><option>Discovery mix</option><option>Artist-focused mix</option></select></div></div><div class="field"><label>PLAYLIST NAME</label><input id="dashname" value="Your next repeat"></div><button class="primary" onclick="state.gen.source=document.getElementById('dashsource').value;state.gen.recipe=document.getElementById('dashrecipe').value;state.gen.name=document.getElementById('dashname').value||'Your next repeat';state.gen.count=20;runGeneration();showSheet('Building your mix','<p>Creating a preview from sample listening data.</p><div class=\'progress\'><span id=\'genbar\' style=\'width:15%\'></span></div><button class=\'secondary\' onclick=\'cancelGeneration();closeSheet()\'>Cancel</button>')">Generate playlist</button><div class="footerhint">Prototype preview · No real playlist is created</div></div></section>
<section class="card"><div class="cardhead"><h2>Your playlists</h2><button class="link" onclick="createPlaylist()">＋ New</button></div><div class="playlistgrid">${state.playlists.slice(0,4).map(p=>'<button class="playlisttile" onclick="push(\'playlist\',{playlistId:'+p.id+'})"><div class="coverstack">'+p.ids.slice(0,3).map(id=>{let t=tracks.find(x=>x.id===id)||tracks[0];return '<img src="'+t.art+'" alt="">'}).join('')+'</div><b>'+p.name+'</b><small>'+p.ids.length+' tracks</small></button>').join('')}</div><div class="actions"><button class="secondary" onclick="state.page='playlists';render()">Manage playlists</button></div></section>
<section class="card"><div class="cardhead"><h2>Scrobbling services</h2><button class="link" onclick="push('settings')">Settings</button></div>
<div class="service"><div class="serviceicon">L</div><div class="meta"><b>Last.fm</b><small>${s.lastfm?'Signed in · '+(s.lastfmUsername||'Account'):'Tap to sign in'}</small></div><span class="status ${s.lastfm?'on':''}">${s.lastfm?'ON':'OFF'}</span><button class="link" onclick="connectScrobble('Last.fm')">${s.lastfm?'Manage':'Connect'}</button></div>
<div class="service"><div class="serviceicon">LB</div><div class="meta"><b>ListenBrainz</b><small>${s.listenBrainz?'Connected':'Token required to enable'}</small></div><span class="status ${s.listenBrainz?'on':''}">${s.listenBrainz?'ON':'OFF'}</span><button class="link" onclick="connectScrobble('ListenBrainz')">${s.listenBrainz?'Manage':'Connect'}</button></div>
<div class="switchrow"><div><b>Scrobble tracks</b><small>Send completed listens to Last.fm.</small></div><input type="checkbox" ${s.lastfmTracks?'checked':''} onchange="state.scrobble.lastfmTracks=this.checked"></div>
<div class="switchrow"><div><b>Primary artist only</b><small>Ignore featured artists.</small></div><input type="checkbox" ${s.lastfmPrimary?'checked':''} onchange="state.scrobble.lastfmPrimary=this.checked"></div>
<div class="switchrow"><div><b>Now playing</b><small>Share the track currently playing.</small></div><input type="checkbox" ${s.lastfmNowPlaying?'checked':''} onchange="state.scrobble.lastfmNowPlaying=this.checked"></div>
<div class="footerhint">Provider sign-in and scrobble delivery are demo-only.</div></section>
</aside></div>`;}
function render(){app.innerHTML='<main class="page">'+screen()+'</main>'+(state.page!=="home"?'<div class="mini" onclick="state.mini=!state.mini;render()">'+img(state.playing.art)+'<div class="meta"><b>'+state.playing.t+'</b><small>'+state.playing.a+'</small></div><button onclick="event.stopPropagation();toast(\'Playback toggled\')">Ⅱ</button><button onclick="event.stopPropagation();toast(\'Next track\')">≫</button></div>':'')+(state.modal?'<div class="sheetback" onclick="if(event.target===this)closeSheet()"><section class="sheet"><h2>'+state.modal.title+'</h2>'+state.modal.body+'<button class="link" style="margin-top:12px" onclick="closeSheet()">Close</button></section></div>':'')+(state.toast?'<div class="toast">'+state.toast+'</div>':'')}
render();
</script></body></html>

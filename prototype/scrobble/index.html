<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--muted);outline-offset:3px}.app{max-width:470px;min-height:100vh;margin:auto;padding-bottom:110px;position:relative;background:var(--bg);overflow:hidden}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:blur(22px);border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.19em;font-size:12px}.iconbtn{border:0;background:transparent;padding:9px;border-radius:50%;font-size:18px}.page{padding:22px 20px 30px;animation:in .22s ease}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700}.h1{font-size:32px;line-height:1.06;letter-spacing:-1.3px;font-weight:760;margin:8px 0 7px}.sub{color:var(--muted);font-size:13px}.section{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}.section h2{font-size:17px;letter-spacing:-.3px;margin:0}.link{border:0;background:none;color:var(--muted);font-size:12px;padding:5px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:18px;min-height:105px}.metric strong{display:block;font-size:25px;letter-spacing:-.8px;margin:6px 0 1px}.metric span{color:var(--muted);font-size:12px}.metric:active,.tile:active,.row:active{transform:scale(.985)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}.chart{height:138px;display:flex;align-items:end;gap:7px;padding:18px 2px 4px}.bar{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#aaa 0%,#555 100%);min-height:8px;position:relative}.bar.sel{background:var(--text)}.chartlabels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.pills{display:flex;gap:7px;overflow:auto;padding:2px 0 5px;scrollbar-width:none}.pill{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:8px 13px;font-size:12px}.pill.active{background:var(--text);color:var(--bg);border-color:var(--text)}.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:transform .12s}.row:last-child{border-bottom:0}.art{width:48px;height:48px;object-fit:cover;border-radius:10px;background:var(--panel2);flex:none}.art.big{width:118px;height:118px;border-radius:17px}.meta{min-width:0;flex:1}.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.meta small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.right{color:var(--muted);font-size:12px;text-align:right}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(470px,100%);z-index:8;background:var(--glass);backdrop-filter:blur(24px);border-top:1px solid var(--line);padding:9px 12px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}.nav button{border:0;background:none;color:var(--muted);font-size:10px;display:grid;gap:3px;justify-items:center;min-width:70px;padding:4px}.nav button strong{font-size:19px;font-weight:500}.nav button.active{color:var(--text)}.mini{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);width:min(438px,calc(100% - 24px));z-index:7;background:var(--glass);backdrop-filter:blur(25px);border:1px solid var(--line);border-radius:17px;padding:9px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}.mini .art{width:38px;height:38px}.mini button{border:0;background:none;padding:7px;font-size:18px}.fab{position:fixed;right:max(calc((100vw - 430px)/2),22px);bottom:145px;width:52px;height:52px;border:0;border-radius:18px;background:var(--text);color:var(--bg);font-size:24px;box-shadow:var(--shadow);z-index:6}.hero{display:flex;gap:18px;align-items:end;margin:22px 0}.hero .art{width:138px;height:138px;border-radius:18px}.hero h1{font-size:25px;line-height:1.05;letter-spacing:-.8px;margin:0 0 6px}.actions{display:flex;gap:9px;margin:16px 0}.primary,.secondary,.danger{border:0;border-radius:99px;padding:11px 18px;font-size:13px;font-weight:650}.primary{background:var(--text);color:var(--bg)}.secondary{background:var(--panel2);color:var(--text)}.danger{background:#8b3030;color:white}.search{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:12px 14px;color:var(--text);margin:14px 0}.tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:15px;text-align:left;min-height:110px}.tile b{display:block;margin:10px 0 3px}.tile small{color:var(--muted)}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field select{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:12px;border-radius:12px;width:100%}.switchrow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.switchrow small{display:block;color:var(--muted)}.switchrow input{accent-color:var(--text);width:19px;height:19px}.sheetback{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:end;justify-content:center}.sheet{width:min(470px,100%);max-height:82vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .2s ease}.sheet h2{margin:0 0 6px;font-size:20px}.sheet p{color:var(--muted);font-size:13px}.sheet .actions{flex-wrap:wrap}.toast{position:fixed;top:74px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);border-radius:99px;padding:9px 16px;font-size:12px;z-index:30;box-shadow:var(--shadow)}.step{display:flex;gap:6px;margin:20px 0}.step i{height:3px;border-radius:8px;background:var(--line);flex:1}.step i.on{background:var(--text)}.progress{height:7px;background:var(--panel2);border-radius:10px;overflow:hidden;margin:16px 0}.progress span{display:block;height:100%;background:var(--text);width:0;transition:width .4s}.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}.heat i{aspect-ratio:1;border-radius:3px;background:var(--panel2)}.heat i:nth-child(4n),.heat i:nth-child(7n){background:#777}.heat i:nth-child(5n){background:#aaa}.empty{text-align:center;padding:38px 20px;color:var(--muted)}.empty b{display:block;color:var(--text);margin-bottom:6px}.muted{color:var(--muted)}.trackcover{width:100%;height:180px;object-fit:cover;border-radius:20px;margin:14px 0}.footerhint{font-size:11px;color:var(--muted);text-align:center;margin:25px 0 8px}
@keyframes in{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@media(min-width:650px){body{padding:24px 0}.app{border:1px solid var(--line);border-radius:30px;min-height:calc(100vh - 48px)}.nav{bottom:24px;border-radius:0 0 30px 30px}.mini{bottom:98px}.fab{bottom:170px}}

<script>
const tracks=[
{id:1,t:"Sweet Disposition",a:"The Temper Trap",al:"Conditions",plays:84,dur:"3:54",mins:329,art:"https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=500",date:"Today · 16:42"},
{id:2,t:"The Less I Know the Better",a:"Tame Impala",al:"Currents",plays:71,dur:"3:36",mins:256,art:"https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=500",date:"Today · 15:18"},
{id:3,t:"505",a:"Arctic Monkeys",al:"Favourite Worst Nightmare",plays:66,dur:"4:13",mins:278,art:"https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=500",date:"Today · 13:04"},
{id:4,t:"Space Song",a:"Beach House",al:"Depression Cherry",plays:59,dur:"5:20",mins:315,art:"https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500",date:"Yesterday · 23:12"},
{id:5,t:"Apocalypse",a:"Cigarettes After Sex",al:"Cigarettes After Sex",plays:52,dur:"4:50",mins:251,art:"https://images.unsplash.com/photo-1506157786151-b8491531f063?w=500",date:"Yesterday · 21:44"},
{id:6,t:"After Dark",a:"Mr.Kitty",al:"Time",plays:48,dur:"4:17",mins:205,art:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=500",date:"Yesterday · 19:06"},
{id:7,t:"505 (Live)",a:"Arctic Monkeys",al:"Live",plays:31,dur:"4:21",mins:135,art:"https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=500",date:"Mon · 20:10"},
{id:8,t:"My Love Mine All Mine",a:"Mitski",al:"The Land Is Inhospitable",plays:28,dur:"2:17",mins:64,art:"https://images.unsplash.com/photo-1483412033650-1015d9137f76?w=500",date:"Mon · 18:32"}];
const artists=[...new Map(tracks.map(t=>[t.a,{name:t.a,art:t.art,plays:tracks.filter(x=>x.a===t.a).reduce((s,x)=>s+x.plays,0)}])).values()];
const albums=[...new Map(tracks.map(t=>[t.al,{name:t.al,artist:t.a,art:t.art,plays:t.plays}])).values()];
let state={tab:"stats",page:"home",stack:[],tabPages:{stats:{page:"stats",stack:[]},generate:{page:"generate",stack:[]},playlists:{page:"playlists",stack:[]}},period:"30 days",search:"",sort:"Plays",theme:"dark",glass:true,mini:false,playing:tracks[0],queue:[],favs:new Set([1,4]),playlists:[{id:1,name:"Late night loop",desc:"For the hours after midnight.",ids:[4,5,6],generated:false},{id:2,name:"On repeat",desc:"The songs that stay.",ids:[1,2,3],generated:false}],draft:null,gen:{source:"Listening history",recipe:"Personal favourites",count:20,name:"Your next repeat",range:"Last 90 days",diversity:65,discovery:35},step:0,modal:null,toast:"",filter:"All"};
const $=s=>document.querySelector(s),app=$("#app");
function push(page,data={}){state.stack.push({page:state.page,tab:state.tab});state.page=page;Object.assign(state,data);render()}
function back(){if(state.modal){state.modal=null;render();return}let p=state.stack.pop();if(p){state.page=p.page;state.tab=p.tab;render()}else if(state.page!=="home"){state.page="home";render()}else toast("You're at the start")}
function toast(msg){state.toast=msg;render();setTimeout(()=>{state.toast="";render()},1800)}
function img(src,cls="art"){return '<img class="'+cls+'" src="'+src+'" onerror="this.style.opacity=.15" alt="">'}
function row(t,i,kind="track"){let title=kind==="track"?t.t:t.name,sub=kind==="track"?t.a:(kind==="artist"?"Artist":t.artist),art=t.art;return '<div class="row" onclick="openItem(\''+kind+'\','+(t.id||i)+')">'+img(art)+'<div class="meta"><b>'+title+'</b><small>'+sub+'</small></div><div class="right">'+(t.plays||"")+'<br><span>plays</span></div><button class="iconbtn" onclick="event.stopPropagation();actions(\''+kind+'\','+(t.id||i)+')">···</button></div>'}
function openItem(kind,id){if(kind==="track")push("track",{item:tracks.find(x=>x.id===id)});else if(kind==="artist")push("artist",{item:artists.find(x=>x.name===id)||artists[id]});else push("album",{item:albums.find(x=>x.name===id)||albums[id]})}
function actions(kind,id){let t=kind==="track"?tracks.find(x=>x.id===id):null;showSheet(kind==="track"?"Track actions":kind+" actions",'<div class="actions"><button class="primary" onclick="play('+id+')">Play now</button><button class="secondary" onclick="queue('+id+')">Add to queue</button></div><div class="row" onclick="toast(\'Added to favourites\');closeSheet()"><div class="meta"><b>♡  '+(t&&state.favs.has(id)?"Remove favourite":"Add to favourites")+'</b><small>Keep it close</small></div></div><div class="row" onclick="push(\'track\',{item:tracks.find(x=>x.id==='+id+')});closeSheet()"><div class="meta"><b>Track details</b></div></div>')}
function play(id){state.playing=tracks.find(x=>x.id===id)||state.playing;toast("Now playing · "+state.playing.t)}
function queue(id){state.queue.push(tracks.find(x=>x.id===id));toast("Added to queue")}
function showSheet(title,body){state.modal={title,body};render()}function closeSheet(){state.modal=null;render()}
function setTab(t){state.tabPages[state.tab]={page:state.page,stack:[...state.stack]};state.tab=t;let saved=state.tabPages[t];state.page=saved?saved.page:t;state.stack=saved?[...saved.stack]:[];render()}
function header(){return '<header class="top"><button class="iconbtn" onclick="back()">‹</button><span class="brand">MYLO</span><button class="iconbtn" onclick="push(\'settings\')">⚙</button></header>'}
function stats(){let total=state.period==="7 days"?128:state.period==="90 days"?1328:state.period==="1 year"?4892:state.period==="All time"?12480:412;return '<div class="eyebrow">YOUR LISTENING, IN FOCUS</div><h1 class="h1">Statistics</h1><p class="sub">A little more of what you love.</p><div class="pills" style="margin:20px 0 14px">'+["7 days","30 days","90 days","1 year","All time","Custom"].map(p=>'<button class="pill '+(state.period===p?'active':'')+'" onclick="period(\''+p+'\')">'+p+'</button>').join('')+'</div><div class="stats">'+[['Plays',total.toLocaleString(),'↗ 12%','tracks'],['Listening time','86h 24m','↗ 8%','time'],['Unique tracks','312','+24 this period','tracks'],['Artists','94','+8 this period','artists'],['Albums','126','+11 this period','albums'],['Streak','12 days','Personal best · 18','history']].map((m,i)=>'<button class="metric" onclick="metric('+i+')"><span>'+m[0]+'</span><strong>'+m[1]+'</strong><span>'+m[2]+'</span></button>').join('')+'</div><div class="section"><h2>Listening activity</h2><button class="link" onclick="push(\'history\')">History ↗</button></div><div class="panel"><div style="display:flex;justify-content:space-between"><b>Daily plays</b><small class="muted">Last 14 days</small></div><div class="chart">'+[32,46,28,65,50,74,42,88,58,68,37,95,61,78].map((v,i)=>'<div class="bar '+(i===12?'sel':'')+'" style="height:'+v+'%" onclick="toast(\''+(i+1)+' days ago · '+v+' plays\')"></div>').join('')+'</div><div class="chartlabels"><span>14 days ago</span><span>Today</span></div></div><div class="section"><h2>Most played</h2><button class="link" onclick="push(\'toptracks\')">See all ↗</button></div>'+tracks.slice(0,4).map((t,i)=>row(t,i)).join('')+'<div class="section"><h2>Top artists</h2><button class="link" onclick="push(\'topartists\')">See all ↗</button></div>'+artists.slice(0,3).map((t,i)=>row(t,i,"artist")).join('')+'<div class="section"><h2>Top albums</h2><button class="link" onclick="push(\'topalbums\')">See all ↗</button></div>'+albums.slice(0,3).map((t,i)=>row(t,i,"album")).join('')+'<div class="section"><h2>Recent listening</h2><button class="link" onclick="push(\'history\')">Full history ↗</button></div>'+tracks.slice(0,3).map((t,i)=>'<div class="row" onclick="openItem(\'track\','+t.id+')">'+img(t.art)+'<div class="meta"><b>'+t.t+'</b><small>'+t.date+'</small></div></div>').join('')}
function listPage(kind){let data=kind==="toptracks"?tracks:kind==="topartists"?artists:albums;let q=state.search.toLowerCase();data=data.filter(x=>(x.t||x.name).toLowerCase().includes(q)||(x.a||x.artist||"").toLowerCase().includes(q));if(state.sort==="A–Z")data=[...data].sort((a,b)=>(a.t||a.name).localeCompare(b.t||b.name));else data=[...data].sort((a,b)=>(b.plays||0)-(a.plays||0));let title=kind==="toptracks"?"Top tracks":kind==="topartists"?"Top artists":"Top albums";return '<div class="eyebrow">STATISTICS</div><h1 class="h1">'+title+'</h1><input class="search" placeholder="Search '+title.toLowerCase()+'" value="'+state.search+'" oninput="state.search=this.value;render()"><div class="pills"><button class="pill active" onclick="state.sort=\'Plays\';render()">Most played</button><button class="pill" onclick="state.sort=\'A–Z\';render()">A–Z</button><button class="pill" onclick="toast(\'Period: \'+state.period)">Period · '+state.period+'</button></div>'+data.map((x,i)=>row(x,i,kind==="toptracks"?"track":kind==="topartists"?"artist":"album")).join('')}
function historyPage(){return '<div class="eyebrow">YOUR LISTENING</div><h1 class="h1">History</h1><p class="sub">Every listen, in its own time.</p><div class="pills" style="margin:18px 0"><button class="pill active" onclick="toast(\'Year: 2026\')">2026 ▾</button><button class="pill" onclick="toast(\'Month: November\')">November ▾</button><button class="pill" onclick="toast(\'Choose a date\')">Choose date</button></div><div class="panel"><div class="section" style="margin:0 0 12px"><h2>Listening rhythm</h2><small class="muted">November</small></div><div class="heat">'+Array.from({length:56},(_,i)=>'<i onclick="toast(\'Nov '+(i+1)+' · '+(i%5+1)+' listens\')"></i>').join('')+'</div><p class="sub" style="margin-bottom:0">Tap a day to view its listens.</p></div><input class="search" placeholder="Search listening history" oninput="state.search=this.value;render()"><div class="section"><h2>Today</h2><button class="link" onclick="toast(\'Grouping: by day\')">Group · Day ▾</button></div>'+tracks.filter(t=>!state.search||t.t.toLowerCase().includes(state.search.toLowerCase())).map((t,i)=>'<div class="row" onclick="openItem(\'track\','+t.id+')">'+img(t.art)+'<div class="meta"><b>'+t.t+'</b><small>'+t.a+' · '+t.date.split("·")[1]+'</small></div><button class="iconbtn" onclick="event.stopPropagation();actions(\'track\','+t.id+')">···</button></div>').join('')}
function detail(kind){let t=state.item||tracks[0],isTrack=kind==="track";let name=isTrack?t.t:t.name,sub=isTrack?t.a:(kind==="artist"?"Artist":t.artist);let art=t.art||tracks[0].art;let related=isTrack?tracks.filter(x=>x.a===t.a):tracks.filter(x=>kind==="artist"?x.a===name:x.al===name);return '<div class="eyebrow">LIBRARY / '+kind.toUpperCase()+'</div><div class="hero">'+img(art,'art big')+'<div><h1>'+name+'</h1><div class="sub">'+sub+'</div><div class="sub" style="margin-top:7px">'+(t.plays||60)+' plays · '+(t.dur||"3:54")+'</div></div></div><div class="actions"><button class="primary" onclick="play('+(t.id||1)+')">▶ Play</button><button class="secondary" onclick="toast(\'Shuffling '+name+'\')">Shuffle</button><button class="secondary" onclick="toast(\'Added to queue\')">＋ Queue</button></div><div class="stats"><div class="metric"><span>Total plays</span><strong>'+(t.plays||60)+'</strong></div><div class="metric"><span>Listening time</span><strong>4h 32m</strong></div></div><div class="section"><h2>'+(isTrack?"Listening history":"Top tracks")+'</h2></div>'+related.map((x,i)=>row(x,i)).join('')+'<div class="panel" style="margin-top:20px"><span class="muted">First played</span><b style="float:right">Jan 12, 2025</b><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><span class="muted">Last played</span><b style="float:right">Today</b></div>'}
function generate(){let g=state.gen;return '<div class="eyebrow">MADE FROM YOUR LISTENS</div><h1 class="h1">Generate</h1><p class="sub">A playlist that sounds like you.</p><div class="step">'+[0,1,2,3].map(i=>'<i class="'+(state.step>=i?'on':'')+'"></i>').join('')+'</div>'+ (state.step===0?'<h2>Choose a source</h2><p class="sub">Start with the part of your library you want to explore.</p>'+["Listening history","Most played tracks","Favourite tracks","Favourite artists","Favourite albums","Existing playlists","Manually selected tracks"].map((x,i)=>'<button class="tile" style="width:100%;min-height:0;margin:5px 0" onclick="state.gen.source=\''+x+'\';state.step=1;render()"><b>'+(i+1)+'. '+x+'</b><small>'+(i===0?"Build from everything you have listened to":i===1?"Your most replayed tracks":"Use your saved "+x.toLowerCase())+'</small></button>').join(''):'')+(state.step===1?'<h2>Choose a recipe</h2><p class="sub">A starting point. You can tune the result next.</p>'+["Personal favourites","Forgotten favourites","Daily mix","Artist-focused mix","Discovery mix","Similar tracks","Time-period mix","Listening-history mix"].map((x,i)=>'<button class="tile" style="width:100%;min-height:0;margin:5px 0" onclick="state.gen.recipe=\''+x+'\';state.step=2;render()"><b>'+x+'</b><small>'+["Your most-loved tracks, balanced across artists.","Loved before, missing from recent rotation.","A fresh set for today.","Go deeper with artists you return to.","A little unfamiliar, still your taste.","Find adjacent sounds from familiar tracks.","A snapshot from a chosen era.","A mix shaped by a listening period."][i]+'</small></button>').join(''):'')+(state.step===2?'<h2>Shape your mix</h2><div class="field"><label>Playlist name</label><input id="gname" value="'+g.name+'"></div><div class="field"><label>Tracks · '+g.count+'</label><input type="range" min="10" max="60" step="5" value="'+g.count+'" oninput="state.gen.count=+this.value;this.previousElementSibling.textContent=&quot;Tracks · &quot;+this.value"></div><div class="field"><label>Date range</label><select onchange="state.gen.range=this.value"><option>Last 90 days</option><option>Last 30 days</option><option>All time</option><option>Last year</option></select></div><div class="field"><label>Familiarity · '+g.diversity+'%</label><input type="range" min="0" max="100" value="'+g.diversity+'" oninput="state.gen.diversity=+this.value;this.previousElementSibling.textContent=&quot;Familiarity · &quot;+this.value+&quot;%&quot;"></div><div class="field"><label>Discovery · '+g.discovery+'%</label><input type="range" min="0" max="100" value="'+g.discovery+'" oninput="state.gen.discovery=+this.value;this.previousElementSibling.textContent=&quot;Discovery · &quot;+this.value+&quot;%&quot;"></div><label class="switchrow">Exclude duplicates <input type="checkbox" checked></label><label class="switchrow">Exclude recently played <input type="checkbox" checked></label><button class="primary" style="width:100%;margin-top:20px" onclick="state.gen.name=$('#gname').value||'My mix';state.step=3;runGeneration()">Generate playlist</button>':'')+(state.step===3?'<div class="panel"><div class="eyebrow">YOUR MIX IS READY</div><h2>'+g.name+'</h2><p class="sub">'+g.source+' · '+g.recipe+'</p><div class="progress"><span id="genbar" style="width:100%"></span></div><b>20 tracks selected</b><p class="sub">A balanced mix based on your listening patterns.</p></div>'+tracks.slice(0,6).map((t,i)=>row(t,i)).join('')+'<div class="actions"><button class="primary" onclick="saveGenerated()">Save playlist</button><button class="secondary" onclick="state.step=2;render()">Adjust</button><button class="secondary" onclick="runGeneration()">Regenerate</button></div>':'')+'<div class="actions">'+(state.step>0&&state.step<3?'<button class="secondary" onclick="state.step--;render()">Back</button>':'')+'</div>'}
function runGeneration(){state.genStatus="running";state.genProgress=0;state.step=3;render();let timer=setInterval(()=>{if(state.genStatus!=="running"){clearInterval(timer);return}state.genProgress=Math.min(100,state.genProgress+20);if(state.genProgress>=100)state.genStatus="done";render()},240)} function cancelGeneration(){state.genStatus="cancelled";state.step=2;render();toast("Generation cancelled")} function saveEditor(){let p=state.playlists.find(x=>x.id===state.playlistId);p.name=$("#editname").value.trim()||p.name;p.desc=$("#editdesc").value;back();toast("Changes saved")}
function saveGenerated(){let id=Date.now();state.playlists.unshift({id,name:state.gen.name,desc:state.gen.recipe+" · "+state.gen.source,ids:tracks.slice(0,6).map(t=>t.id),generated:true});toast("Saved to your playlists");state.tab="playlists";state.page="playlists";state.stack=[];render()}
function playlists(){return '<div class="eyebrow">YOUR COLLECTION</div><h1 class="h1">Playlists</h1><p class="sub">A place for every version of you.</p><div class="actions"><button class="primary" onclick="createPlaylist()">＋ New playlist</button><button class="secondary" onclick="state.filter=state.filter===\'All\'?'Generated':'All';render()">'+state.filter+' ▾</button></div><input class="search" placeholder="Find a playlist" oninput="state.search=this.value;render()">'+state.playlists.filter(p=>(state.filter==="All"||p.generated)&&p.name.toLowerCase().includes(state.search.toLowerCase())).map(p=>'<div class="row" onclick="push(\'playlist\',{playlistId:'+p.id+'})">'+img((tracks.find(t=>t.id===p.ids[0])||tracks[0]).art)+'<div class="meta"><b>'+p.name+'</b><small>'+p.ids.length+' tracks · '+(p.generated?"Generated":"Playlist")+'</small></div><button class="iconbtn" onclick="event.stopPropagation();playlistActions('+p.id+')">···</button></div>').join('')+'<div class="footerhint">Your playlists stay in this prototype session.</div>'}
function playlistDetail(){let p=state.playlists.find(x=>x.id===state.playlistId);if(!p)return '<div class="empty">Playlist not found</div>';let list=p.ids.map(id=>tracks.find(t=>t.id===id)).filter(Boolean);return '<div class="eyebrow">PLAYLIST</div><div class="hero">'+img((list[0]||tracks[0]).art,'art big')+'<div><h1>'+p.name+'</h1><div class="sub">'+p.desc+'</div><div class="sub">'+list.length+' tracks · '+list.reduce((s,t)=>s+t.mins,0)+' min</div></div></div><div class="actions"><button class="primary" onclick="play('+list[0].id+')">▶ Play</button><button class="secondary" onclick="toast(\'Shuffling playlist\')">Shuffle</button><button class="secondary" onclick="push(\'editor\')">Edit</button></div><div class="section"><h2>Tracks</h2><button class="link" onclick="push(\'addtracks\')">＋ Add tracks</button></div>'+list.map((t,i)=>row(t,i)).join('')+'<div class="section"><button class="link" onclick="sharePlaylist()">Share / export</button><button class="link" onclick="playlistActions('+p.id+')">More actions ···</button></div>'}
function createPlaylist(){showSheet("New playlist",'<div class="field"><label>Name</label><input id="newname" placeholder="Give it a name"></div><div class="field"><label>Description</label><input id="newdesc" placeholder="Optional"></div><button class="primary" onclick="let n=$(\'#newname\').value.trim();if(!n){toast(\'Enter a playlist name\');return}state.playlists.unshift({id:Date.now(),name:n,desc:$(\'#newdesc\').value,ids:[],generated:false});closeSheet();toast(\'Playlist created\')">Create playlist</button>')}
function playlistActions(id){showSheet('Playlist options','<button class="tile" style="width:100%;margin:5px 0" onclick="state.playlistId='+id+';push(\\'editor\\');closeSheet()">Edit playlist</button><button class="tile" style="width:100%;margin:5px 0" onclick="sharePlaylist();closeSheet()">Share / export</button><button class="danger" onclick="confirmDeletePlaylist('+id+')">Delete playlist</button>')} function confirmDeletePlaylist(id){showSheet('Delete playlist?','<p>This cannot be undone.</p><button class="danger" onclick="deletePlaylist('+id+')">Delete playlist</button>')} function deletePlaylist(id){state.playlists=state.playlists.filter(p=>p.id!==id);state.modal=null;state.page='playlists';state.tab='playlists';state.stack=[];render();toast('Playlist deleted')}
function editor(){let p=state.playlists.find(x=>x.id===state.playlistId);return '<div class="eyebrow">PLAYLIST EDITOR</div><h1 class="h1">Edit playlist</h1><div class="field"><label>Name</label><input id="editname" value="'+p.name+'"></div><div class="field"><label>Description</label><input id="editdesc" value="'+p.desc+'"></div><div class="section"><h2>Reorder tracks</h2><small class="muted">Use ↑ ↓</small></div>'+p.ids.map((id,i)=>{let t=tracks.find(x=>x.id===id);return '<div class="row">'+img(t.art)+'<div class="meta"><b>'+t.t+'</b><small>'+t.a+'</small></div><button class="iconbtn" onclick="moveTrack('+i+',-1)">↑</button><button class="iconbtn" onclick="moveTrack('+i+',1)">↓</button><button class="iconbtn" onclick="removeTrack('+id+')">×</button></div>'}).join('')+'<div class="actions"><button class="primary" onclick="saveEditor()">Save changes</button><button class="secondary" onclick="back()">Discard</button><button class="secondary" onclick="push(\'addtracks\')">Add tracks</button></div>'}
function moveTrack(i,d){let p=state.playlists.find(x=>x.id===state.playlistId),j=i+d;if(j<0||j>=p.ids.length)return;[p.ids[i],p.ids[j]]=[p.ids[j],p.ids[i]];render()}
function removeTrack(id){let p=state.playlists.find(x=>x.id===state.playlistId);p.ids=p.ids.filter(x=>x!==id);render();toast("Track removed")}
function addTracks(){return '<div class="eyebrow">YOUR LIBRARY</div><h1 class="h1">Add tracks</h1><input class="search" placeholder="Search tracks" oninput="state.search=this.value;render()">'+tracks.filter(t=>!state.search||t.t.toLowerCase().includes(state.search.toLowerCase())).map(t=>'<label class="row">'+img(t.art)+'<div class="meta"><b>'+t.t+'</b><small>'+t.a+'</small></div><input type="checkbox" value="'+t.id+'" '+(state.playlists.find(p=>p.id===state.playlistId).ids.includes(t.id)?'disabled':'')+'></label>').join('')+'<button class="primary" style="width:100%;margin-top:18px" onclick="let p=state.playlists.find(p=>p.id===state.playlistId);document.querySelectorAll(\'input[type=checkbox]:checked\').forEach(x=>{let id=+x.value;if(!p.ids.includes(id))p.ids.push(id)});back();toast(\'Tracks added\')">Add selected</button>'}
function settings(){return '<div class="eyebrow">PREFERENCES</div><h1 class="h1">Scrobble settings</h1><p class="sub">Make this space feel like yours.</p><div class="section"><h2>Appearance</h2></div><div class="panel"><div class="switchrow">Light theme <input type="checkbox" '+(state.theme==="light"?"checked":"")+' onchange="state.theme=this.checked?\'light\':\'dark\';document.documentElement.classList.toggle(\'light\',this.checked)"></div><div class="switchrow">Glass surfaces <input type="checkbox" '+(state.glass?"checked":"")+' onchange="state.glass=this.checked;document.documentElement.style.setProperty(\'--glass\',this.checked?(state.theme===\'light\'?\'rgba(255,255,255,.78)\':\'rgba(30,30,35,.76)\'):(state.theme===\'light\'?\'#fff\':\'#19191c\'))"></div><div class="switchrow">Reduce motion <input type="checkbox" onchange="document.documentElement.style.setProperty(\'--motion\',this.checked?\'0\':\'1\');toast(\'Motion preference updated\')"></div></div>'+[['Statistics','Default period','30 days'],['Statistics','Default destination','Statistics'],['Generation','Default source','Listening history'],['Generation','Default track count','20'],['Generation','Exclude duplicates','On'],['Playlists','Default sorting','Recently updated'],['Playlists','Confirm deletion','On'],['History','Group listens by','Day']].map(x=>'<div class="switchrow" onclick="showSheet(\''+x[1]+'\',\'<p>Current: '+x[2]+'</p><button class=secondary onclick=\'closeSheet()\'>Done</button>\')"><div><b>'+x[1]+'</b><small>'+x[0]+'</small></div><span class="muted">'+x[2]+'　›</span></div>').join('')+'<div class="section"><h2>Data & privacy</h2></div><div class="panel"><p class="sub">This prototype uses local sample data only. No listening activity is sent to a service.</p><button class="danger" onclick="showSheet(\'Clear prototype data?\',\'<p>This resets playlists and session changes.</p><button class=danger onclick=\'state.playlists=[];state.favs.clear();closeSheet();toast(\'Prototype data cleared\')\'>Clear data</button>\')">Clear prototype data</button></div>'}
function metric(i){if(i===0)push("toptracks");else if(i===1||i===5)push("history");else if(i===3)push("topartists");else if(i===4)push("topalbums");else push("toptracks")}
function period(p){if(p==="Custom"){showSheet("Custom date range",'<div class="field"><label>From</label><input type="date" id="from"></div><div class="field"><label>To</label><input type="date" id="to"></div><button class="primary" onclick="state.period=\'Custom\';closeSheet();render()">Apply range</button>')}else{state.period=p;render()}}
function sharePlaylist(){toast("Share sheet · copied playlist summary")}
function screen(){if(state.page==="home")return '<div class="eyebrow">MYLO MUSIC</div><h1 class="h1">Good evening.</h1><p class="sub">Your music, just where you left it.</p><div class="panel" style="margin-top:26px"><div class="eyebrow">NOW PLAYING</div><div class="row" onclick="toast(\'Opening existing player preview\')">'+img(state.playing.art)+'<div class="meta"><b>'+state.playing.t+'</b><small>'+state.playing.a+'</small></div><b>Ⅱ</b></div></div><div class="section"><h2>Your library</h2></div><div class="tilegrid"><button class="tile" onclick="setTab(\'stats\')">◷<b>Statistics</b><small>Your listening story</small></button><button class="tile" onclick="setTab(\'generate\')">✳<b>Generate</b><small>Make a mix</small></button></div><p class="footerhint">Home preview · Existing layout represented only</p>' ;if(state.page==="stats")return stats();if(["toptracks","topartists","topalbums"].includes(state.page))return listPage(state.page);if(state.page==="history")return historyPage();if(["track","artist","album"].includes(state.page))return detail(state.page);if(state.page==="generate")return generate();if(state.page==="playlists")return playlists();if(state.page==="playlist")return playlistDetail();if(state.page==="editor")return editor();if(state.page==="addtracks")return addTracks();if(state.page==="settings")return settings();return '<div class="empty">Prototype screen</div>'}
function render(){document.documentElement.classList.toggle("light",state.theme==="light");app.innerHTML=header()+'<main class="page">'+screen()+'</main>'+(state.page==="home"?'<button class="fab" aria-label="Open Scrobble" onclick="push(\'stats\')">⌁</button>':'')+(state.page!=="home"?'<div class="mini" onclick="state.mini=!state.mini;render()">'+img(state.playing.art)+'<div class="meta"><b>'+state.playing.t+'</b><small>'+state.playing.a+'</small></div><button onclick="event.stopPropagation();toast(\'Playback toggled\')">Ⅱ</button><button onclick="event.stopPropagation();toast(\'Next track\')">≫</button></div>':'')+(state.mini?'<div class="sheetback" onclick="if(event.target===this){state.mini=false;render()}"><section class="sheet" style="text-align:center"><button class="link" onclick="state.mini=false;render()">⌄ Close player</button>'+img(state.playing.art,'trackcover')+'<h2>'+state.playing.t+'</h2><p>'+state.playing.a+'</p><div class="actions" style="justify-content:center"><button class="secondary" onclick="toast(\\'Previous track\\')">|◀</button><button class="primary" onclick="toast(\\'Playback toggled\\')">Ⅱ</button><button class="secondary" onclick="toast(\\'Next track\\')">▶|</button></div><p class="sub">Playing in the existing Mylo player · prototype controls</p></section></div>':'')+(state.page!=="home"?'<nav class="nav">'+[['stats','◷','Stats'],['generate','✳','Generate'],['playlists','▤','Playlists']].map(x=>'<button class="'+(state.tab===x[0]?'active':'')+'" onclick="setTab(\''+x[0]+'\')"><strong>'+x[1]+'</strong>'+x[2]+'</button>').join('')+'</nav>':'')+(state.modal?'<div class="sheetback" onclick="if(event.target===this)closeSheet()"><section class="sheet"><div style="width:36px;height:4px;background:var(--line);border-radius:8px;margin:0 auto 18px"></div><h2>'+state.modal.title+'</h2>'+state.modal.body+'<button class="link" style="margin-top:12px" onclick="closeSheet()">Close</button></section></div>':'')+(state.toast?'<div class="toast">'+state.toast+'</div>':'')}
render();
</script></body></html>

name: MYLO Signed Release Builds

on:
  workflow_dispatch:
    inputs:
      upload_apks:
        description: "Upload signed APKs as a GitHub Actions artifact (uses storage quota)"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: mylo-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build and verify signed Android releases
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only this job writes to the repo: it creates the GitHub release.
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;36.0.0 platforms;android-37.0 platforms;android-36 cmake;3.22.1"

      - name: Add Android 37 SDK path expected by current AGP
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$ANDROID_HOME/platforms/android-37.0" && ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Restore release keystore from Actions secrets
        shell: bash
        env:
          MYLO_RELEASE_KEYSTORE_BASE64: ${{ secrets.MYLO_RELEASE_KEYSTORE_BASE64 }}
          MYLO_RELEASE_STORE_PASSWORD: ${{ secrets.MYLO_RELEASE_STORE_PASSWORD }}
          MYLO_RELEASE_KEY_PASSWORD: ${{ secrets.MYLO_RELEASE_KEY_PASSWORD }}
          MYLO_RELEASE_KEY_ALIAS: ${{ secrets.MYLO_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in MYLO_RELEASE_KEYSTORE_BASE64 MYLO_RELEASE_STORE_PASSWORD MYLO_RELEASE_KEY_PASSWORD MYLO_RELEASE_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Actions secret $name is missing or empty."
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/mylo-signing"
          printf '%s' "$MYLO_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mylo-signing/MYLO-release-key.jks"
          test -s "$RUNNER_TEMP/mylo-signing/MYLO-release-key.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/mylo-signing/MYLO-release-key.jks
          storePassword=$MYLO_RELEASE_STORE_PASSWORD
          keyAlias=$MYLO_RELEASE_KEY_ALIAS
          keyPassword=$MYLO_RELEASE_KEY_PASSWORD
          EOF
          chmod 600 keystore.properties "$RUNNER_TEMP/mylo-signing/MYLO-release-key.jks"
          keytool -list -keystore "$RUNNER_TEMP/mylo-signing/MYLO-release-key.jks" -storepass "$MYLO_RELEASE_STORE_PASSWORD" -alias "$MYLO_RELEASE_KEY_ALIAS" >/dev/null
          # Public certificate digest; the verify step requires every APK to be signed by exactly this key.
          expected_digest="$(keytool -exportcert -alias "$MYLO_RELEASE_KEY_ALIAS" -keystore "$RUNNER_TEMP/mylo-signing/MYLO-release-key.jks" -storepass "$MYLO_RELEASE_STORE_PASSWORD" | sha256sum | cut -d' ' -f1)"
          test -n "$expected_digest"
          echo "MYLO_EXPECTED_CERT_SHA256=$expected_digest" >> "$GITHUB_ENV"
          echo "Keystore file and configured alias validated."

      - name: Build signed phone, TV and Wear OS release APKs
        env:
          # Read by app/tv build files; without them the release silently ships empty Last.fm keys.
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleProdRelease :tv:assembleProdRelease :wearos:assembleProdRelease

      - name: Name release APKs for the in-app updater
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -oP 'bitchordVersionName"\] = "\K[^"]+' build.gradle.kts)"
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version v${version} in build.gradle.kts."
            exit 1
          fi
          rename_module() {
            local dir="$1" prefix="$2" apk base abi new
            local -a apks
            [[ -d "$dir" ]] || { echo "::error::Missing release output directory $dir"; exit 1; }
            mapfile -d '' -t apks < <(find "$dir" -maxdepth 1 -type f -name '*.apk' -print0)
            for apk in "${apks[@]}"; do
              base="$(basename "$apk")"
              abi="$(grep -oE 'armeabi-v7a|arm64-v8a|x86_64' <<<"$base" | head -n1 || true)"
              if [[ -n "$abi" ]]; then new="${prefix}-${version}_${abi}.apk"; else new="${prefix}-${version}.apk"; fi
              if [[ -e "$dir/$new" ]]; then echo "::error::Name clash for $new in $dir"; exit 1; fi
              mv "$apk" "$dir/$new"
              echo "Named $base -> $new"
            done
          }
          # Prefixes must match UPDATE_APK_PREFIX in app/ and tv/ build files.
          rename_module app/build/outputs/apk/prod/release Mylo
          rename_module tv/build/outputs/apk/prod/release MyloTV
          rename_module wearos/build/outputs/apk/prod/release MyloWear

      - name: Verify release APK signatures
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/prod/release tv/build/outputs/apk/prod/release wearos/build/outputs/apk/prod/release -type f -name '*.apk' | sort)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "::error::No release APKs were produced."
            exit 1
          fi
          test -n "${MYLO_EXPECTED_CERT_SHA256:-}"
          for apk in "${apks[@]}"; do
            out="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs --verbose "$apk")"
            printf '%s\n' "$out"
            if ! grep -qi "Signer #1 certificate SHA-256 digest: ${MYLO_EXPECTED_CERT_SHA256}" <<<"$out"; then
              echo "::error::$apk is not signed with the MYLO release key (debug or other key)."
              exit 1
            fi
            echo "Verified MYLO release signature: $apk"
          done

      - name: Upload signed release APKs (manual opt-in only)
        id: upload_apks
        if: github.event_name == 'workflow_dispatch' && inputs.upload_apks
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mylo-signed-release-apks
          path: |
            app/build/outputs/apk/prod/release/*.apk
            tv/build/outputs/apk/prod/release/*.apk
            wearos/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Report artifact upload failure
        if: always() && github.event_name == 'workflow_dispatch' && inputs.upload_apks && steps.upload_apks.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Signed APKs built and signatures verified, but GitHub Actions artifact storage rejected the upload. This is a storage quota/accounting issue, not a Gradle build failure."
          {
            echo "### Signed APKs built, but upload failed"
            echo "All signed phone, TV and Wear OS release APKs were built and signature-verified. GitHub rejected artifact storage because the Actions storage quota is still enforced. Check account-level Actions/Packages storage; do not rerun the build solely to retry this upload."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report artifact upload skipped
        if: github.event_name == 'workflow_dispatch' && !inputs.upload_apks
        run: echo "Signed APKs were built and verified locally in the runner; artifact upload was skipped to preserve Actions storage quota."

      - name: Create GitHub release with the signed APKs
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Mylo $GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}" \
            app/build/outputs/apk/prod/release/*.apk \
            tv/build/outputs/apk/prod/release/*.apk \
            wearos/build/outputs/apk/prod/release/*.apk

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f keystore.properties
          rm -rf "$RUNNER_TEMP/mylo-signing"

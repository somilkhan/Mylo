name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # InnerTubeX ships TokenProvider bytecode compiled for Java 21 (class
      # version 65). Robolectric loads it while BitChordApplication starts,
      # so the test JVM must be Java 21 even though app bytecode targets 17.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          {
            echo "LASTFM_API_KEY=$LASTFM_API_KEY"
            echo "LASTFM_SECRET=$LASTFM_SECRET"
            echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER"
          } > local.properties

      # One stable debug key for every dev build, so an APK from CI
      # installs over the last one. Fails the job if the secret is absent.
      - name: Install the stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
        run: bash .github/scripts/debug-keystore.sh install

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew testDevDebugUnitTest

      - name: Build the dev APK
        run: ./gradlew assembleDevDebug

      - name: Check the APK is signed with the stable debug key
        env:
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
        run: bash .github/scripts/debug-keystore.sh verify app/build/outputs/apk/dev/debug/*.apk

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: mylo-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/

  backend:
    name: Backend · Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  web:
    name: Web tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      # The job sets web/ as its working directory, so checkout must happen
      # first; otherwise the runner cannot start even the initial Corepack step.
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web unit tests
        run: pnpm test

      - name: Typecheck web workspace
        run: pnpm typecheck

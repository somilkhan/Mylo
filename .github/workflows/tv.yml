name: TV

# The Android TV app builds from the phone app's sources (see tv/README.md), so
# a change under app/, shared/, sharedUi/ or native/ can break it as easily as
# one under tv/.
on:
  push:
    branches: [main]
    paths:
      - 'tv/**'
      - 'app/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/tv.yml'
  pull_request:
    paths:
      - 'tv/**'
      - 'app/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/tv.yml'

permissions:
  contents: read

concurrency:
  group: tv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv:
    name: Android TV
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          {
            echo "LASTFM_API_KEY=$LASTFM_API_KEY"
            echo "LASTFM_SECRET=$LASTFM_SECRET"
            echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER"
          } > local.properties

      # One stable debug key for every dev build, so an APK from any run
      # installs over the one already on the phone. Fails the job if the
      # secret is missing or unusable; see .github/scripts/debug-keystore.sh.
      - name: Install the stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
        run: bash .github/scripts/debug-keystore.sh install

      - run: chmod +x gradlew

      - name: Build the TV dev APK
        run: ./gradlew :tv:assembleDevDebug

      - name: Check the APK is signed with the stable debug key
        env:
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
        run: bash .github/scripts/debug-keystore.sh verify tv/build/outputs/apk/dev/debug/*.apk

      - name: Upload the TV dev APK
        uses: actions/upload-artifact@v4
        with:
          name: mylo-tv-dev-debug
          path: tv/build/outputs/apk/dev/debug/*universal*.apk

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tv-build-reports
          path: tv/build/reports/

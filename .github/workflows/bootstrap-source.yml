name: Bootstrap MYLO source

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MYLO repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import the existing BitChord foundation
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/somilkhan/BitChord.git /tmp/bitchord
          rsync -a --delete --exclude='.git' /tmp/bitchord/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import BitChord foundation for MYLO"
          git push origin HEAD:main

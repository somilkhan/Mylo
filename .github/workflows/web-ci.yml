name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          # Default would run `pnpm install` from the repo root, where there is no
          # package.json (web/ is the workspace), failing the job in seconds.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TEMPORARY debug: job logs can't be read from outside, so the failing step's
      # output is posted to the PR. Remove once the web build is green.
      - name: Typecheck all web workspaces
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee ../web-typecheck.log

      - name: Run web unit tests
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee ../web-test.log

      - name: Build web app and extension
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee ../web-build.log
        env:
          # Build-only placeholder: vite.config.ts fails without it. Nothing from this job is deployed.
          VITE_PARTY_SERVER_URL: https://party.example.com

      - name: Post web failure output to the PR
        if: failure() && github.event.pull_request.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          {
            echo "## Web CI failure output"
            for f in web-typecheck.log web-test.log web-build.log; do
              [ -f "$f" ] || continue
              echo "### $f (tail)"
              echo '```'
              tail -n 80 "$f"
              echo '```'
            done
          } > web-errors.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file web-errors.md || echo "comment failed"

name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 cmake;3.22.1"

      - name: Add Android 37 SDK path expected by current AGP
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$ANDROID_HOME/platforms/android-37.0" && ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"

      - name: Report installed Android platforms
        run: sdkmanager --list | grep -E "platforms;android-|build-tools;" | head -30

      - name: Build Android app, TV and Wear OS variants
        id: build_apks
        run: ./gradlew --no-daemon --stacktrace :app:assembleDevDebug :tv:assembleDevDebug :wearos:assembleDevDebug

      - name: Run Android unit tests
        id: test_android
        run: ./gradlew --no-daemon --stacktrace :app:testDevDebugUnitTest

      - name: Upload debug APKs
        id: upload_apks
        if: always() && steps.build_apks.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mylo-dev-debug-apks
          path: |
            app/build/outputs/apk/dev/debug/*.apk
            tv/build/outputs/apk/dev/debug/*.apk
            wearos/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Report APK artifact upload failure
        if: always() && steps.build_apks.outcome == 'success' && steps.upload_apks.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Android build succeeded, but GitHub could not store the APK artifacts. The Android unit-test result is reported separately by the test step. Check Actions artifact storage quota."
          {
            echo "### APK artifacts unavailable"
            echo "Android/TV/Wear OS APK builds succeeded, but artifact upload failed. Android unit-test outcome: ${{ steps.test_android.outcome }}. Check the repository's GitHub Actions storage quota."
          } >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compile desktop application
        run: ./gradlew --no-daemon --stacktrace :desktopApp:compileKotlin

      - name: Run desktop unit tests
        run: ./gradlew --no-daemon --stacktrace :desktopApp:test

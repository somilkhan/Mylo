name: Android CI

on:
  push:
    branches: [main, Main-dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  # ChatGPT can request a build by posting /build-apk on a PR as the repo owner.
  # This workflow lives on main because issue_comment workflows are loaded from the default branch.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      build_apks:
        description: "Build and upload Android/TV/Wear OS APKs for device testing"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: android-ci-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.body == '/build-apk' && github.event.comment.user.login == 'somilkhan')
    name: Android unit tests (optional APK build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve pull request head commit for requested builds
        id: pr_head
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_head.outputs.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 cmake;3.22.1"

      - name: Add Android 37 SDK path expected by current AGP
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$ANDROID_HOME/platforms/android-37.0" && ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"

      - name: Report installed Android platforms
        run: sdkmanager --list | grep -E "platforms;android-|build-tools;" | head -30

      - name: Build Android app, TV and Wear OS APKs
        id: build_apks
        if: (github.event_name == 'workflow_dispatch' && inputs.build_apks) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/build-apk' && github.event.comment.user.login == 'somilkhan')
        run: ./gradlew --no-daemon --stacktrace :app:assembleDevDebug :tv:assembleDevDebug :wearos:assembleDevDebug

      - name: Run Android unit tests
        id: test_android
        if: always()
        run: ./gradlew --no-daemon --stacktrace :app:testDevDebugUnitTest

      - name: Upload debug APKs
        id: upload_apks
        if: ((github.event_name == 'workflow_dispatch' && inputs.build_apks) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/build-apk' && github.event.comment.user.login == 'somilkhan')) && steps.build_apks.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mylo-dev-debug-apks
          path: |
            app/build/outputs/apk/dev/debug/*.apk
            tv/build/outputs/apk/dev/debug/*.apk
            wearos/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Report APK artifact upload failure
        if: always() && ((github.event_name == 'workflow_dispatch' && inputs.build_apks) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/build-apk' && github.event.comment.user.login == 'somilkhan')) && steps.build_apks.outcome == 'success' && steps.upload_apks.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Android build succeeded, but GitHub could not store the APK artifacts. Check Actions artifact storage quota."
          {
            echo "### APK artifacts unavailable"
            echo "Android/TV/Wear OS APKs built, but artifact upload failed. Android unit-test outcome: ${{ steps.test_android.outcome }}. Check the repository's GitHub Actions storage quota."
          } >> "$GITHUB_STEP_SUMMARY"

  desktop:
    if: github.event_name != 'issue_comment'
    name: Desktop compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compile desktop application
        run: ./gradlew --no-daemon --stacktrace :desktopApp:compileKotlin

      - name: Run desktop unit tests
        run: ./gradlew --no-daemon --stacktrace :desktopApp:test

  web:
    if: github.event_name != 'issue_comment'
    name: Web tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web unit tests
        run: pnpm test

      - name: Typecheck web workspace
        run: pnpm typecheck

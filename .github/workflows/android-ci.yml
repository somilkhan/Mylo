name: Android CI

on:
  push:
    branches: [main, "feat/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_apks:
        description: "Build and upload Android/TV/Wear OS APKs for device testing"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android unit tests (optional APK build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 cmake;3.22.1"

      - name: Add Android 37 SDK path expected by current AGP
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$ANDROID_HOME/platforms/android-37.0" && ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"

      - name: Report installed Android platforms
        run: sdkmanager --list | grep -E "platforms;android-|build-tools;" | head -30

      - name: Build Android app, TV and Wear OS APKs (manual opt-in only)
        id: build_apks
        if: github.event_name == 'workflow_dispatch' && inputs.build_apks
        run: ./gradlew --no-daemon --stacktrace :app:assembleDevDebug :tv:assembleDevDebug :wearos:assembleDevDebug

      - name: Compile TV Android source set
        run: ./gradlew --no-daemon --stacktrace :tv:compileDevDebugKotlin

      - name: Run Android unit tests
        id: test_android
        run: ./gradlew --no-daemon --stacktrace :app:testDevDebugUnitTest

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumented tests on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # The hosted runner has <3 GB free after SDK setup; the AVD's 7.3 GB
          # default userdata image cannot be created. Keep the test device lean.
          disk-size: 2G
          pre-emulator-launch-script: bash .github/scripts/configure-avd-userdata.sh
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace :app:connectedDevDebugAndroidTest

      - name: Upload debug APKs (manual opt-in only)
        id: upload_apks
        if: github.event_name == 'workflow_dispatch' && inputs.build_apks && steps.build_apks.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mylo-dev-debug-apks
          path: |
            app/build/outputs/apk/dev/debug/*.apk
            tv/build/outputs/apk/dev/debug/*.apk
            wearos/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Report APK artifact upload failure
        if: always() && github.event_name == 'workflow_dispatch' && inputs.build_apks && steps.build_apks.outcome == 'success' && steps.upload_apks.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Android build succeeded, but GitHub could not store the APK artifacts. Check Actions artifact storage quota."
          {
            echo "### APK artifacts unavailable"
            echo "Android/TV/Wear OS APK builds succeeded, but artifact upload failed. Android unit-test outcome: ${{ steps.test_android.outcome }}. Check the repository's GitHub Actions storage quota."
          } >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compile desktop application
        run: ./gradlew --no-daemon --stacktrace :desktopApp:compileKotlin

      - name: Run shared JVM unit tests
        run: ./gradlew --no-daemon --stacktrace :shared:jvmTest :sharedUi:jvmTest :desktopUi:jvmTest

      - name: Run desktop unit tests
        run: ./gradlew --no-daemon --stacktrace :desktopApp:test

  web:
    name: Web tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web unit tests
        run: pnpm test

      - name: Typecheck web workspace
        run: pnpm typecheck

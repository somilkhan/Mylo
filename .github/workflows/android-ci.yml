name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools cmake;3.22.1"

      - name: Report installed Android platforms
        run: sdkmanager --list | grep -E "platforms;android-|build-tools;" | head -30

      - name: Build Android debug variant
        run: ./gradlew --no-daemon --stacktrace :app:assembleDevDebug

      - name: Run Android unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDevDebugUnitTest
